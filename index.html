<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>合租生活管家 · 客户端</title>
<!-- 内联 favicon（零请求）：上日轮下星月的简化版，避免浏览器请求 /favicon.ico 产生 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23F3E7CB'/%3E%3Ccircle cx='16' cy='13' r='6' fill='%23F6C453'/%3E%3Cpath d='M4 18h24a12 12 0 0 1-24 0z' fill='%232B3A55'/%3E%3C/svg%3E">
<meta name="description" content="合租生活管家客户端：同一屋檐下的白天与夜晚。费用分摊、清洁值日、公共物品、室友公约。">
<style>
/* ============================================================
   设计令牌 —— 晴天 / 夜空 双主题
   切换机制：data-theme="day" | "night"，由时间自动决定并可手动覆盖
   ============================================================ */
:root{
  /* 注意：--ease 之前漏了定义，导致 17 处 transition 整条声明被丢弃
     （引用未定义变量 = 该声明失效，属性退回初始值），昼夜切换因此是硬跳变。 */
  --ease: cubic-bezier(0.4, 0, 0.2, 1);            /* 标准缓动：hover / 颜色 / 透明度 */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --dur-press: 130ms;
  --dur-fast: 180ms;
  --dur-base: 240ms;
  --r-sm: 12px; --r-md: 18px; --r-lg: 24px; --r-xl: 30px;
}

/* ---------- 晴天（白天） ---------- */
:root, [data-theme="day"]{
  --sky-1:#BEE4F7; --sky-2:#DCEEF8; --sky-3:#FFF7E8; --sky-4:#FFEEDA;
  --deco-cloud: rgba(255,255,255,.92);
  --deco-cloud-sh: rgba(120,160,200,.20);
  --sun-core:#FFF3C4; --sun-mid:#FFC24B; --sun-edge:#FF9F43; --sun-glow:rgba(255,183,77,.45);
  --ink:#16273A; --ink-2:#41566B; --ink-3:#7B8FA3; --ink-4:#A9BCCB;
  --glass: rgba(255,255,255,.58);
  --glass-strong: rgba(255,255,255,.78);
  --glass-brd: rgba(255,255,255,.85);
  --glass-in: rgba(255,255,255,.75);
  --glass-sh: 0 10px 34px -12px rgba(31,68,102,.30);
  --primary:#2E8BC0; --primary-2:#4FA8D8; --primary-soft:rgba(46,139,192,.12);
  --accent:#F2921D; --accent-soft:rgba(242,146,29,.14);
  --good:#2E9E6B; --good-soft:rgba(46,158,107,.14);
  --warn:#D9822B; --warn-soft:rgba(217,130,43,.15);
  --bad:#D0503F; --bad-soft:rgba(208,80,63,.13);
  --line: rgba(22,39,58,.10);
  --line-2: rgba(22,39,58,.06);
  --scrim: rgba(22,39,58,.34);
  --shadow-lift: 0 18px 40px -22px rgba(31,68,102,.55);
}
/* ---------- 夜空（夜晚） ---------- */
[data-theme="night"]{
  --sky-1:#070B1A; --sky-2:#111A33; --sky-3:#1B2748; --sky-4:#2A2145;
  --deco-cloud: rgba(180,200,235,.14);
  --deco-cloud-sh: rgba(0,0,0,.30);
  --moon-core:#FFFDF3; --moon-edge:#E8DDAF; --moon-glow:rgba(255,246,205,.34);
  --ink:#EEF3FF; --ink-2:#B7C6E2; --ink-3:#7E90B4; --ink-4:#5A6B8C;
  --glass: rgba(255,255,255,.075);
  --glass-strong: rgba(255,255,255,.12);
  --glass-brd: rgba(255,255,255,.16);
  --glass-in: rgba(255,255,255,.22);
  --glass-sh: 0 10px 34px -12px rgba(0,0,0,.60);
  --primary:#7BB6F0; --primary-2:#9CCBF7; --primary-soft:rgba(123,182,240,.16);
  --accent:#FFD97D; --accent-soft:rgba(255,217,125,.16);
  --good:#5FD3A0; --good-soft:rgba(95,211,160,.16);
  --warn:#FFB35C; --warn-soft:rgba(255,179,92,.16);
  --bad:#FF8A7A; --bad-soft:rgba(255,138,122,.16);
  --line: rgba(255,255,255,.12);
  --line-2: rgba(255,255,255,.07);
  --scrim: rgba(3,6,15,.62);
  --shadow-lift: 0 18px 40px -22px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100dvh; color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  /* 注意：linear-gradient 不能参与 transition（渐变不可插值），
     所以这里把底色固定为白天色，夜晚交给 .night-sky 覆盖层淡入 ——
     只写 transition:background 是没有效果的，那正是之前切换会「跳」的原因。 */
  background:linear-gradient(170deg,#BEE4F7 0%,#DCEEF8 42%,#FFF7E8 78%,#FFEEDA 100%);
  background-attachment:fixed;
  transition:color var(--dur-base) var(--ease);
  overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
a{color:var(--primary)}

/* ============================================================
   天空装饰层 —— 太阳 / 月亮 / 云 / 星星 / 流星
   全部只动 transform 与 opacity
   ============================================================ */
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sky > *{position:absolute;will-change:transform,opacity}
/* 夜晚底色：单独一层，用 opacity 过渡。
   渐变不能参与 transition，所以昼夜切换只能靠「两层叠加 + 淡入淡出」来实现 */
.night-sky{
  inset:0;
  background:linear-gradient(170deg,#070B1A 0%,#111A33 42%,#1B2748 78%,#2A2145 100%);
  opacity:0;transition:opacity 560ms var(--ease);
}
[data-theme="night"] .night-sky{opacity:1}

/* 太阳 */
.sun{
  width:92px;height:92px;border-radius:50%;right:8%;top:7%;
  background:radial-gradient(circle at 38% 34%, var(--sun-core), var(--sun-mid) 62%, var(--sun-edge));
  box-shadow:0 0 64px 20px var(--sun-glow), 0 0 120px 46px var(--sun-glow);
  animation:sunBreathe 7s var(--ease-in-out) infinite;
}
.sun::before{
  content:"";position:absolute;inset:-34px;border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0 12deg, var(--sun-glow) 15deg 18deg, transparent 21deg 30deg);
  mask:radial-gradient(circle, transparent 46%, #000 48%, #000 62%, transparent 64%);
  -webkit-mask:radial-gradient(circle, transparent 46%, #000 48%, #000 62%, transparent 64%);
  animation:spin 60s linear infinite;
}
@keyframes sunBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* 月亮 */
.moon{
  width:78px;height:78px;border-radius:50%;right:9%;top:8%;
  background:radial-gradient(circle at 34% 30%, var(--moon-core), var(--moon-edge) 68%, #C9BE92);
  box-shadow:0 0 38px 9px var(--moon-glow), inset -14px -10px 22px rgba(150,140,105,.42);
  animation:moonFloat 9s var(--ease-in-out) infinite;
}
.moon::after{
  content:"";position:absolute;left:16%;top:52%;width:14px;height:14px;border-radius:50%;
  background:rgba(190,180,140,.30);box-shadow:22px -20px 0 -4px rgba(190,180,140,.22);
}
@keyframes moonFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* 云 */
.cloud{width:118px;height:36px;border-radius:40px;background:var(--deco-cloud);box-shadow:0 8px 26px var(--deco-cloud-sh)}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:54px;height:54px;top:-25px;left:16px}
.cloud::after{width:38px;height:38px;top:-17px;left:58px}
.cloud.c1{left:-140px;top:16%;animation:drift 46s linear infinite}
.cloud.c2{left:-180px;top:34%;transform:scale(.72);opacity:.8;animation:drift 68s linear infinite 6s}
.cloud.c3{left:-160px;top:8%;transform:scale(.52);opacity:.6;animation:drift 88s linear infinite 18s}
@keyframes drift{to{transform:translateX(calc(100vw + 220px))}}

/* 星星 */
.stars{position:absolute;inset:0}
/* 光晕用 radial-gradient 画，不用 box-shadow ——
   阴影在缩放动画里会带来额外的绘制开销，渐变则完全在合成层内缩放 */
.star{position:absolute;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.5) 40%,rgba(255,255,255,0) 72%);
  animation:twinkle 4s var(--ease-in-out) infinite}
.star.big{width:11px;height:11px}
@keyframes twinkle{0%,100%{opacity:.22;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

/* 流星 */
/* 流星：三颗固定位置轮流出场。
   之前是「单颗 + 每轮 JS 随机」，13 秒才出现一次、每次只亮一秒多，实测等不到，
   所以改成多颗错峰循环，位置写死在 CSS，出现频率提到几秒一次。
   方向固定向右下；旋转角度由 JS 按视口比例补算（见 client-ui.js），保证轨迹与倾角一致。 */
.meteor{
  width:90px;height:2px;border-radius:2px;top:0;left:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.9));
  opacity:0;transform-origin:100% 50%;
  --dur:8s;--delay:0s;
}
/* 轨迹终点都落在视口内（起始 + 位移 ≤ 85vw），避免「飞出去了才亮」 */
.meteor.m1{--mx:-4vw;--my:2vh;--mdx:52vw;--mdy:34vh;--dur:7s;--delay:0s}
.meteor.m2{--mx:16vw;--my:-4vh;--mdx:46vw;--mdy:38vh;--dur:9s;--delay:2.2s}
.meteor.m3{--mx:38vw;--my:6vh;--mdx:40vw;--mdy:28vh;--dur:11s;--delay:4.6s}
@keyframes meteor{
  0%{opacity:0;transform:translate3d(var(--mx,0), var(--my,0), 0) rotate(var(--mrot,36deg))}
  6%{opacity:1}
  28%{opacity:0;transform:translate3d(calc(var(--mx,0) + var(--mdx,50vw)), calc(var(--my,0) + var(--mdy,34vh)), 0) rotate(var(--mrot,36deg))}
  100%{opacity:0;transform:translate3d(calc(var(--mx,0) + var(--mdx,50vw)), calc(var(--my,0) + var(--mdy,34vh)), 0) rotate(var(--mrot,36deg))}
}
/* 只在夜空播放 */
[data-theme="night"] .sky .meteor{animation:meteor var(--dur,8s) linear infinite var(--delay,0s)}

/* 主题可见性：晴天才显示太阳与云，夜空才显示月亮与星 */
.sky .sun,.sky .cloud{opacity:1;transition:opacity 520ms var(--ease)}
.sky .moon,.sky .stars{opacity:0;transition:opacity 520ms var(--ease)}
[data-theme="night"] .sky .sun,[data-theme="night"] .sky .cloud{opacity:0}
[data-theme="night"] .sky .moon{opacity:1}
[data-theme="night"] .sky .stars{opacity:1}
/* 星星的闪烁只在夜空跑：白天停掉，避免无意义的绘制 */
.star{animation-play-state:paused}
[data-theme="night"] .star{animation-play-state:running}

/* 地平线微光 */
.horizon{position:absolute;left:-10%;right:-10%;bottom:-12%;height:38%;border-radius:50% 50% 0 0;background:radial-gradient(ellipse at 50% 100%, var(--sun-glow), transparent 68%);opacity:.55;transition:opacity 520ms var(--ease)}
[data-theme="night"] .horizon{background:radial-gradient(ellipse at 50% 100%, rgba(123,182,240,.28), transparent 70%);opacity:.7}

/* ============================================================
   液态玻璃
   ============================================================ */
.glass{
  background:var(--glass);
  backdrop-filter:blur(26px) saturate(185%);
  -webkit-backdrop-filter:blur(26px) saturate(185%);
  border:1px solid var(--glass-brd);
  border-radius:var(--r-lg);
  box-shadow:var(--glass-sh), inset 0 1px 0 var(--glass-in);
}
.glass.soft{border-radius:var(--r-md)}
.glass.tight{border-radius:var(--r-sm)}
/* 高光扫边：仅在 hover 时出现，避免静态时就"脏" */
.glass.hi{position:relative;overflow:hidden}
.glass.hi::after{
  content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.34), transparent);
  transform:skewX(-18deg);opacity:0;transition:opacity var(--dur-fast) var(--ease);
}
@media (hover:hover) and (pointer:fine){
  .glass.hi:hover::after{opacity:1;animation:sheen 900ms var(--ease-out)}
}
@keyframes sheen{from{left:-60%}to{left:120%}}

/* ============================================================
   按钮 —— 全部带按压反馈
   ============================================================ */
/* 默认即主按钮 —— 旧渲染里大量写的是裸 .btn，必须自带背景与文字色 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 20px;border-radius:14px;font-size:14px;font-weight:700;line-height:1.2;
  border:1px solid transparent;position:relative;overflow:hidden;
  background:linear-gradient(135deg, var(--primary-2), var(--primary) 55%, var(--primary-2));
  background-size:200% 100%;color:#fff;
  box-shadow:0 10px 26px -12px color-mix(in srgb, var(--primary) 90%, transparent), inset 0 1px 0 rgba(255,255,255,.34);
  transition:transform var(--dur-press) var(--ease-out), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease);
}
[data-theme="night"] .btn{color:#0B1026}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:active{transform:none}

/* 主按钮：阳光/月光渐变 + 呼吸光晕 */
.btn.primary{
  color:#fff;
  background:linear-gradient(135deg, var(--primary-2), var(--primary) 55%, var(--primary-2));
  background-size:200% 100%;
  box-shadow:0 10px 26px -12px color-mix(in srgb, var(--primary) 90%, transparent), inset 0 1px 0 rgba(255,255,255,.34);
}
[data-theme="night"] .btn.primary{color:#0B1026}
@media (hover:hover) and (pointer:fine){
  .btn.primary:hover{background-position:100% 0;box-shadow:0 14px 32px -12px color-mix(in srgb, var(--primary) 95%, transparent), inset 0 1px 0 rgba(255,255,255,.4)}
}
/* 强调按钮：太阳橙 */
.btn.accent{
  color:#fff;background:linear-gradient(135deg, #FFC24B, var(--accent) 60%, #E07C12);
  box-shadow:0 10px 26px -12px rgba(242,146,29,.9), inset 0 1px 0 rgba(255,255,255,.4);
}
[data-theme="night"] .btn.accent{color:#2A1B00;background:linear-gradient(135deg, #FFE6A6, #FFD97D 55%, #E8B84A)}
/* 玻璃按钮（不再单独做 backdrop 模糊：它几乎总在已经模糊过的卡片内部） */
.btn.ghost{
  background:var(--glass);border-color:var(--glass-brd);color:var(--ink-2);
  box-shadow:inset 0 1px 0 var(--glass-in);
}
@media (hover:hover) and (pointer:fine){.btn.ghost:hover{background:var(--glass-strong);color:var(--ink)}}
/* 文字按钮 */
.btn.link{background:none;color:var(--ink-3);font-weight:600;padding:9px 12px}
@media (hover:hover) and (pointer:fine){.btn.link:hover{color:var(--ink-2);background:var(--line-2)}}
.btn.link:active{transform:none}
/* 危险 */
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb, var(--bad) 30%, transparent)}
.btn.wide{width:100%}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:11px}
.btn.lg{padding:14px 26px;font-size:15px;border-radius:16px}
.btnrow{display:flex;gap:9px;margin-top:12px}
.btnrow > .btn{flex:1}
.btnrow.pri{display:grid;grid-template-columns:1.7fr 1fr}

/* ============================================================
   Logo
   ============================================================ */
.logo{width:52px;height:52px;flex:0 0 auto;position:relative}
.logo svg{width:100%;height:100%;display:block;overflow:visible}
.logo .halo{animation:spin 34s linear infinite;transform-origin:50% 50%}
.logo .ray{opacity:.9;transition:opacity 520ms var(--ease)}
.logo .stars-mini circle{animation:twinkle 3.6s var(--ease-in-out) infinite}
.logo .stars-mini circle:nth-child(2){animation-delay:.9s}
.logo .stars-mini circle:nth-child(3){animation-delay:1.8s}
[data-theme="night"] .logo .ray{opacity:.35}
.logo.lg{width:78px;height:78px}
.logo.sm{width:34px;height:34px}

/* ============================================================
   布局
   ============================================================ */
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 20px}
.center-stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:44px 20px}
.stage{width:100%;max-width:820px}

/* 标题区 */
.brand-hero{text-align:center;margin-bottom:30px}
.brand-hero .logo{margin:0 auto 16px}
.brand-hero h1{margin:0;font-size:29px;font-weight:800;letter-spacing:-.6px}
.brand-hero p{margin:8px 0 0;color:var(--ink-3);font-size:14px}
.brand-hero .tag{display:inline-block;margin-top:12px;padding:5px 14px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--glass);border:1px solid var(--glass-brd);color:var(--ink-2);backdrop-filter:blur(12px)}

/* ============================================================
   账号卡片选择器
   ============================================================ */
.acct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.acct{
  position:relative;padding:20px 14px 16px;border-radius:var(--r-md);text-align:center;
  background:var(--glass);border:1px solid var(--glass-brd);
  backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);
  box-shadow:var(--glass-sh), inset 0 1px 0 var(--glass-in);
  transition:transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease), border-color var(--dur-fast) var(--ease);
  animation:popIn 320ms var(--ease-out) backwards;
}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.acct:active{transform:scale(.975)}
@media (hover:hover) and (pointer:fine){
  .acct:hover{transform:translateY(-5px);box-shadow:var(--shadow-lift), inset 0 1px 0 var(--glass-in);border-color:color-mix(in srgb, var(--primary) 42%, var(--glass-brd))}
}
.acct .ava{
  width:60px;height:60px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:23px;font-weight:800;color:#fff;position:relative;
  box-shadow:0 8px 22px -10px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.35);
}
.acct .ava .badge{position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;border-radius:50%;background:var(--glass-strong);backdrop-filter:blur(8px);border:1px solid var(--glass-brd);display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1}
.acct .nm{font-size:15px;font-weight:700;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .mt{font-size:11.5px;color:var(--ink-3);margin:3px 0 0}
.acct .del{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-3);background:var(--line-2);opacity:0;transition:opacity var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
@media (hover:hover) and (pointer:fine){.acct:hover .del{opacity:1}}
.acct .del:hover{color:var(--bad);background:var(--bad-soft)}
.acct.new{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:152px;border-style:dashed;border-color:color-mix(in srgb, var(--primary) 40%, transparent);color:var(--primary)}
.acct.new .plus{width:52px;height:52px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:400;margin-bottom:10px;transition:transform var(--dur-base) var(--ease-out)}
@media (hover:hover) and (pointer:fine){.acct.new:hover .plus{transform:rotate(90deg) scale(1.06)}}

/* ============================================================
   表单
   ============================================================ */
.field{margin-bottom:14px;position:relative}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-3);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border-radius:14px;font-size:15px;
  background:var(--glass);border:1px solid var(--glass-brd);color:var(--ink);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-4)}
.field textarea{resize:vertical;min-height:62px;line-height:1.6;font-family:inherit}
.field .f-hint{margin:7px 0 0;font-size:11.5px;color:var(--ink-4);line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--primary);background:var(--glass-strong);
  box-shadow:0 0 0 4px var(--primary-soft);
}
.field .err{color:var(--bad);font-size:12.5px;margin-top:6px;display:none}
.field.bad input{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
.field.bad .err{display:block}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.f2{grid-template-columns:1fr}}
.field label .opt{font-weight:600;color:var(--ink-4);margin-left:5px}
.field label .req{font-weight:700;color:var(--accent);margin-left:5px}

/* 分段控件：用于「创建 / 加入」这类二选一，比 radio 更清楚也更省空间 */
.seg{display:flex;gap:6px;padding:5px;border-radius:15px;background:var(--line-2);border:1px solid var(--glass-brd)}
.seg-i{
  flex:1;padding:11px 10px;border-radius:11px;border:none;background:none;cursor:pointer;
  font-size:13.5px;font-weight:700;color:var(--ink-3);white-space:nowrap;
  transition:background 170ms var(--ease), color 170ms var(--ease), box-shadow 170ms var(--ease), transform var(--dur-press) var(--ease-out);
}
.seg-i.on{background:var(--glass-strong);color:var(--ink);box-shadow:0 3px 10px -4px rgba(0,0,0,.22)}
.seg-i:active{transform:scale(.97)}

/* 密码强度 */
.pw-meter{display:flex;gap:5px;margin-top:8px}
.pw-meter i{flex:1;height:4px;border-radius:3px;background:var(--line);transition:background var(--dur-fast) var(--ease)}

/* ============================================================
   主壳
   ============================================================ */
.shell{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;padding:11px 0;
  background:color-mix(in srgb, var(--sky-2) 55%, transparent);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid var(--line);
}
.topbar .inner{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:12px}
.topbar .logo{width:38px;height:38px}
.topbar .t-name{font-size:15px;font-weight:800;letter-spacing:-.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .t-sub{font-size:11.5px;color:var(--ink-3);margin-top:-2px}
.topbar .spacer{flex:1}
.icon-btn{
  width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  background:var(--glass);border:1px solid var(--glass-brd);color:var(--ink-2);
  transition:transform var(--dur-press) var(--ease-out), background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.icon-btn:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.icon-btn:hover{background:var(--glass-strong);color:var(--ink)}}
.icon-btn svg{width:19px;height:19px}
.icon-btn .sun-ico{display:none}
[data-theme="night"] .icon-btn .sun-ico{display:block}
[data-theme="night"] .icon-btn .moon-ico{display:none}

.stage-inner{flex:1;max-width:1180px;width:100%;margin:0 auto;padding:18px 20px 96px}

/* 底部导航 */
.tabbar{
  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:40;
  display:flex;gap:4px;padding:7px;border-radius:22px;
  background:var(--glass-strong);border:1px solid var(--glass-brd);
  backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);
  box-shadow:var(--glass-sh), inset 0 1px 0 var(--glass-in);
  max-width:calc(100vw - 28px);
}
.tabbar .tab{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 14px;border-radius:16px;font-size:10.5px;font-weight:700;color:var(--ink-3);
  transition:color var(--dur-fast) var(--ease), transform var(--dur-press) var(--ease-out);
}
.tabbar .tab:active{transform:scale(.94)}
.tabbar .tab svg{width:20px;height:20px}
.tabbar .tab .pill{position:absolute;inset:0;border-radius:16px;background:var(--primary-soft);opacity:0;transform:scale(.86);transition:opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out)}
.tabbar .tab.on{color:var(--primary)}
.tabbar .tab.on .pill{opacity:1;transform:scale(1)}
.tabbar .tab > *{position:relative;z-index:1}
.tabbar .cnt{position:absolute;top:2px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--accent);color:#fff;font-size:9.5px;font-weight:800;line-height:16px;text-align:center;z-index:2}
[data-theme="night"] .tabbar .cnt{color:#2A1B00}

/* ============================================================
   内容块
   ============================================================ */
.sec{margin-bottom:18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;padding-left:2px}
/* 区块标题右侧：统计文字 + 新增入口 */
.sec-r{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-3)}
.mini-add{
  width:26px;height:26px;flex:0 0 auto;border-radius:9px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:var(--glass);border:1px solid var(--glass-brd);color:var(--primary);
  font-size:16px;font-weight:800;line-height:1;
  transition:transform 140ms var(--ease-out), background 140ms var(--ease), border-color 140ms var(--ease);
}
.mini-add:active{transform:scale(.88)}
@media (hover:hover) and (pointer:fine){.mini-add:hover{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 30%,transparent)}}
.sec-h h2{margin:0;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec-h h2::before{content:"";width:3px;height:14px;border-radius:2px;background:linear-gradient(var(--primary-2),var(--primary))}
.sec-h .more{font-size:12px;color:var(--ink-3)}

/* 视图切换：区块依次淡入（40ms 错峰），比整页一起动更有层次。
   只动 opacity / transform，且不给每张卡片各自动画 —— 列表长时那样非常贵 */
@keyframes secIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
#view.view-enter > .sec{animation:secIn 300ms var(--ease-out) backwards}
#view.view-enter > .sec:nth-child(2){animation-delay:40ms}
#view.view-enter > .sec:nth-child(3){animation-delay:80ms}
#view.view-enter > .sec:nth-child(4){animation-delay:120ms}
#view.view-enter > .sec:nth-child(n+5){animation-delay:160ms}

.card{
  padding:16px 18px;margin-bottom:11px;position:relative;
  background:var(--glass);
  backdrop-filter:blur(12px) saturate(180%);-webkit-backdrop-filter:blur(12px) saturate(180%);
  border:1px solid var(--glass-brd);border-radius:var(--r-lg);
  box-shadow:var(--glass-sh), inset 0 1px 0 var(--glass-in);
}
.card.tap{cursor:pointer}
/* 行容器：图标 + 文字 + 右侧金额。
   必须自带 width:100% —— 历史上 .ico 的 width:38px 被误加到 .cr 上，
   行容器被压成 38px，文字被迫逐字竖排（"今日值日"变竖条）。 */
.cr{display:flex;align-items:flex-start;gap:12px;width:100%;min-width:0}
/* 旧渲染里 .cr 的第一个子元素常常是没有类名的 div，必须补 flex */
.cr > div{flex:1;min-width:0}
.cr .blk,.cr-b{flex:1;min-width:0}
.card h3{margin:0;font-size:15px;font-weight:700;line-height:1.45}
.card p{margin:4px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.55}
.card .amt{font-size:16px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 0 auto}
.cr > .tag,.cr > .pill,.cr > .tico,.cr > .amt{flex:0 0 auto}

/* 图标块 */
.ico{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:16px;font-weight:800;position:relative}
.ico svg{width:19px;height:19px}
.ico.money{background:var(--primary-soft);color:var(--primary)}
.ico.shift{background:var(--good-soft);color:var(--good)}
.ico.item{background:var(--accent-soft);color:var(--accent)}
.ico.pact{background:var(--primary-soft);color:var(--primary)}
.ico.warn{background:var(--warn-soft);color:var(--warn)}

/* 标签 */
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--line-2);color:var(--ink-3)}
.tag.g{background:var(--good-soft);color:var(--good)}
.tag.o{background:var(--warn-soft);color:var(--warn)}
.tag.r{background:var(--bad-soft);color:var(--bad)}
.tag.b{background:var(--primary-soft);color:var(--primary)}

/* 概览卡（首页视觉重心） */
.hero-card{padding:22px;position:relative;overflow:hidden;margin-bottom:18px}
.hero-card .glow{position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle, var(--sun-glow), transparent 66%);pointer-events:none}
[data-theme="night"] .hero-card .glow{background:radial-gradient(circle, var(--moon-glow), transparent 66%)}
.hero-card .lbl{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;position:relative}
.hero-card .num{font-size:38px;font-weight:800;letter-spacing:-1.4px;line-height:1.12;margin:4px 0 2px;font-variant-numeric:tabular-nums;position:relative}
.hero-card .note{font-size:12.5px;color:var(--ink-3);position:relative}
.hero-stats{display:flex;gap:10px;margin-top:18px;position:relative}
.hstat{flex:1;padding:11px 12px;border-radius:var(--r-sm);background:var(--glass);border:1px solid var(--glass-brd)}
.hstat b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.hstat span{font-size:11px;color:var(--ink-3)}

/* 空状态 */
.empty{text-align:center;padding:38px 18px;color:var(--ink-3);font-size:13.5px}
.empty .em{width:64px;height:64px;margin:0 auto 14px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-brd);display:flex;align-items:center;justify-content:center;font-size:27px;animation:floaty 5s var(--ease-in-out) infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:6px}

/* ============================================================
   弹层
   ============================================================ */
.mask{position:fixed;inset:0;z-index:60;background:var(--scrim);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn var(--dur-fast) var(--ease-out)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;
  padding:22px 20px 26px;border-radius:var(--r-xl) var(--r-xl) 0 0;
  background:var(--glass-strong);border:1px solid var(--glass-brd);border-bottom:none;
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 -14px 44px -18px rgba(0,0,0,.45), inset 0 1px 0 var(--glass-in);
  animation:sheetUp 300ms var(--ease-drawer);
}
@keyframes sheetUp{from{transform:translateY(26px);opacity:.7}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 5px;font-size:18px;display:flex;align-items:center;gap:9px}
.sheet .sh-sub{margin:0 0 18px;font-size:12.5px;color:var(--ink-3)}
@media (min-width:620px){.mask{align-items:center;padding:26px}.sheet{border-radius:var(--r-xl);border-bottom:1px solid var(--glass-brd);max-height:84dvh}}

/* toast */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:90;
  padding:12px 22px;border-radius:999px;font-size:13.5px;font-weight:700;
  background:var(--glass-strong);border:1px solid var(--glass-brd);color:var(--ink);
  backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  box-shadow:var(--glass-sh);opacity:0;pointer-events:none;max-width:82vw;text-align:center;
  transition:opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* 弹层打开时把 toast 移到顶部 —— 否则它会正好盖住表单字段 */
body.sheet-open .toast{bottom:auto;top:22px;transform:translate(-50%,-14px)}
body.sheet-open .toast.on{transform:translate(-50%,0)}

/* 隐身/工具 */
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)}
.sub{font-size:12.5px;color:var(--ink-3);margin:5px 0 0}
.divide{height:1px;background:var(--line-2);margin:14px 0}
.rowitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line-2);font-size:13.5px}
.rowitem:last-child{border-bottom:none}
.rowitem .nm{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.rowitem .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ============================================================
   兼容层 —— 复用既有渲染函数产出的类名，统一到新视觉
   （渲染逻辑只有一份，两个页面行为一致）
   ============================================================ */
.card.tint{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 26%,var(--glass-brd))}
.card.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 28%,var(--glass-brd))}
.card.alert{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,var(--glass-brd))}
.card.tap{cursor:pointer;transition:transform var(--dur-base) var(--ease-out),box-shadow var(--dur-base) var(--ease),border-color var(--dur-fast) var(--ease)}
@media (hover:hover) and (pointer:fine){.card.tap:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}}
.card.tap:active{transform:scale(.985)}

.tico{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:16px;font-weight:800}
.tico.money{background:var(--primary-soft);color:var(--primary)}
.tico.shift{background:var(--good-soft);color:var(--good)}
.tico.item{background:var(--accent-soft);color:var(--accent)}
.tico.pact{background:var(--primary-soft);color:var(--primary)}
.tico.warn{background:var(--warn-soft);color:var(--warn)}
.tico.sm-tico{width:26px;height:26px;border-radius:9px;font-size:11px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--line-2);color:var(--ink-3)}
.pill.g{background:var(--good-soft);color:var(--good)}
.pill.o{background:var(--warn-soft);color:var(--warn)}
.pill.r{background:var(--bad-soft);color:var(--bad)}
.pill.b{background:var(--primary-soft);color:var(--primary)}

/* 概览卡：旧类名 .hero 映射到新视觉 */
.hero{padding:22px;position:relative;overflow:hidden;margin-bottom:18px;border-radius:var(--r-lg);background:var(--glass);border:1px solid var(--glass-brd);box-shadow:var(--glass-sh),inset 0 1px 0 var(--glass-in);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%)}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,var(--sun-glow),transparent 66%);pointer-events:none}
[data-theme="night"] .hero::after{background:radial-gradient(circle,var(--moon-glow),transparent 66%)}
.hero > *{position:relative}
.hero .h-lbl{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.hero .h-num{font-size:38px;font-weight:800;letter-spacing:-1.4px;line-height:1.12;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero .h-note{font-size:12.5px;color:var(--ink-3)}
.hero .h-stats{display:flex;gap:10px;margin-top:18px}
.hero .h-stat{flex:1;padding:11px 12px;border-radius:var(--r-sm);background:var(--glass);border:1px solid var(--glass-brd)}
.hero .h-stat b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.hero .h-stat span{font-size:11px;color:var(--ink-3)}
.hero .h-acts{display:flex;gap:9px;margin-top:16px}
.hero .btn{flex:1}
/* 概览卡上的按钮：旧渲染用的是 on-hero / on-hero-ghost */
.hero .btn.on-hero{background:#fff;color:var(--primary);box-shadow:0 10px 24px -12px rgba(0,0,0,.45)}
[data-theme="night"] .hero .btn.on-hero{background:rgba(255,255,255,.94);color:#0B1026}
.hero .btn.on-hero-ghost{
  background:var(--glass);border-color:var(--glass-brd);color:var(--ink-2);
  box-shadow:inset 0 1px 0 var(--glass-in);font-weight:600;
}

.big{font-size:30px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.av{width:24px;height:24px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.bar{height:7px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:5px;background:var(--primary);transition:width 420ms var(--ease-out)}
.bar i.o{background:var(--warn)}
.bar i.r{background:var(--bad)}
.rowlist{display:flex;flex-direction:column}
.kvmini{font-size:12px;color:var(--ink-3);margin-top:9px;display:flex;flex-wrap:wrap;gap:10px}
.preview{background:var(--line-2);border:1px dashed color-mix(in srgb,var(--primary) 34%,transparent);border-radius:var(--r-sm);padding:13px 14px;margin:6px 0 14px}
.preview .ph{font-size:11.5px;font-weight:800;color:var(--primary);letter-spacing:.04em;margin-bottom:8px}
.chk{display:flex;align-items:flex-start;gap:9px;padding:7px 0;font-size:13.5px;color:var(--ink-2)}
.chk input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--primary);flex:0 0 auto}
.empty .em-ico{width:64px;height:64px;margin:0 auto 14px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-brd);display:flex;align-items:center;justify-content:center;font-size:27px;color:var(--primary);font-weight:700;animation:floaty 5s var(--ease-in-out) infinite}
.linky{color:var(--primary);font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}

/* ============================================================
   可访问性
   ============================================================ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .sky .star,.sky .meteor{opacity:.5 !important}
}

<body>

</div>

<!-- 登录/注册 -->
<div class="center-stage" id="authStage">
  <div class="stage">
    <div class="brand-hero">
      <div class="logo lg" id="logoAuth"></div>
      <h1>合租生活管家</h1>

    </div>
    <div id="authBody"></div>
  </div>
</div>

<!-- 主壳 -->
<div class="shell hide" id="appShell">
  <header class="topbar">
    <div class="inner">
      <div class="logo" id="logoTop"></div>
      <div style="min-width:0">
        <div class="t-name" id="houseName">安心小屋</div>
        <div class="t-sub" id="houseSub">3 位室友</div>
      </div>
      <div class="spacer"></div>

<script>
/* ============================================================
   合租生活管家 · 应用逻辑
   阶段〇~四：数据层加固 / 状态机校验 / 无障碍 / 功能补全
   ------------------------------------------------------------
   设计约束（不可退让）：
   ① 最终产物是单文件 index.html，本文件只是可维护的源码形态
   ② 金额一律以「整数分」存储与计算，只在渲染时转元

   ④ 数据异常绝不静默重置：先备份、再提示、由用户决定
   ============================================================ */
(function () {
'use strict';

/* ============================================================
   0 · 常量与基础工具
   ============================================================ */
let KEY = 'roomies_data_guest';   // 每个账号一份数据空间，登录后由 UI 层重设为 roomies_data_<id>
const BAK = 'roomies_backup';      // 损坏数据原始副本的键前缀
const SCHEMA = 2;                  // 数据结构版本
const CONFIRM_HOURS = 72;          // 账单确认时限：超时视为默认通过
const GRACE_DAYS = 3;              // 补打窗口：只允许补打近 N 天的任务

const AREAS = [
  { name: '卫生间', list: ['地漏滤网', '台面水渍', '马桶', '垃圾清运'] },
  { name: '厨房', list: ['灶台油污', '水槽滤网', '台面', '垃圾桶'] },
  { name: '客厅与地面', list: ['地面清扫', '茶几整理', '沙发缝隙'] },
  { name: '垃圾清运', list: ['厨余垃圾', '可回收物', '更换垃圾袋'] }
];

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => (p || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dcn = ds => { const p = String(ds || '').split('-'); return p.length === 3 ? Number(p[1]) + '月' + Number(p[2]) + '日' : '待定'; };
const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const nowHM = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const todayStr = () => ymd(new Date());
const timeTag = () => { const d = new Date(); return dcn(ymd(d)) + ' ' + nowHM(); };
const daysBetween = (a, b) => Math.round((new Date(b.replace(/-/g, '/')) - new Date(a.replace(/-/g, '/'))) / 86400000);

/* 业务异常：可被 UI 捕获并友好提示，而不是让页面崩掉 */
function BizError(msg) { const e = new Error(msg); e.name = 'BizError'; return e; }

/* ---- 金额：内部一律整数分，只有这两处允许换算 ---- */
const fen = y => { const n = Number(y); return Number.isFinite(n) ? Math.round(n * 100) : 0; };
const yuan = f => (Number(f) || 0) / 100;
const fmt = f => '¥' + yuan(f).toFixed(2);

/* ============================================================
   1 · 数据层：seed / 迁移 / 校验 / 持久化
   ============================================================ */
let S = null;
let REPAIRS = [];      // 本次加载自动修复的记录（用于告知用户，绝不静默）

function seed() {
  const ds = todayStr();
  const members = [
    { id: 'm1', name: '小林', room: '主卧', weight: 1.2, joinedAt: ds },
    { id: 'm2', name: '小周', room: '次卧', weight: 1.0, joinedAt: ds },

  ];
  const ids = members.map(m => m.id);

  const b2shares = splitEven(fen(120.00), ids, 'm2');
  const now = Date.now();
  return {
    schemaVersion: SCHEMA,
    house: { name: '安心小屋' },
    pactVersion: 'v1.2',
    me: 'm3',
    members,
    bills: [
      {
        id: 'b1', title: '电费 2026-09', category: '水电', amount: fen(286.40), payerId: 'm1', rule: 'even',
        participants: ids.slice(), weightSnapshot: { m1: 1.2, m2: 1.0, m3: 0.8 },
        shares: b1shares, confirm: { m1: 'ok', m2: 'ok', m3: 'pending' },
        status: 'confirming', date: ds, period: ds.slice(0, 7), version: 1,
        dueAt: now + CONFIRM_HOURS * 3600000, note: '抄表 1842 → 2214 kWh',
        meter: { prev: 1842, curr: 2214, unit: 'kWh', price: fen(0.538) },
        history: [{ version: 1, at: now, by: 'm1', what: '创建账单' }]
      },
      {
        id: 'b2', title: '宽带 2026-09', category: '网费', amount: fen(120.00), payerId: 'm2', rule: 'even',
        participants: ids.slice(), weightSnapshot: { m1: 1.2, m2: 1.0, m3: 0.8 },
        shares: b2shares, confirm: { m1: 'ok', m2: 'ok', m3: 'ok' },
        status: 'settled', date: ds, period: ds.slice(0, 7), version: 1, dueAt: null,
        note: '9 月 12 日已结清', meter: null,
        history: [{ version: 1, at: now, by: 'm2', what: '创建账单' }, { version: 1, at: now, by: 'm1', what: '全部结清' }]
      }
    ],
    transfers: [],
    tasks: [],
    swaps: [],
    items: [
      { id: 'i1', name: '抽纸', category: '消耗品', stock: 0, safety: 2, restockQty: 6, unit: '包', days: 0, purchaserId: 'm2', scope: 'all', location: '客厅柜' },
      { id: 'i2', name: '垃圾袋', category: '消耗品', stock: 36, safety: 10, restockQty: 60, unit: '只', days: 24, purchaserId: 'm3', scope: 'all', location: '厨房柜' },
      { id: 'i3', name: '洗洁精', category: '消耗品', stock: 1, safety: 2, restockQty: 3, unit: '瓶', days: 5, purchaserId: 'm1', scope: 'all', location: '水槽下' },
      { id: 'i4', name: '吸尘器', category: '共享设备', stock: 1, safety: 0, restockQty: 1, unit: '台', days: 0, purchaserId: null, scope: 'all', location: '阳台',
        borrow: { by: 'm3', due: '今晚 20:00' } }
    ],
    restocks: [],
    scoreLog: [
      { id: 'sc1', memberId: 'm2', delta: 10, reason: '完成值日「厨房」', at: Date.now() - 86400000 },
      { id: 'sc2', memberId: 'm1', delta: 8, reason: '认领公共采购「洗洁精」', at: Date.now() - 172800000 }
    ],
    voucher: {},   // memberId -> 本季度已用豁免券数量
    pacts: [
      { id: 'p1', text: '房租、水电、燃气按人头均摊', category: '费用与分摊', binding: 'M1 · 账单默认分摊方式', enforceable: true, rule: { type: 'split', value: 'even' } },
      { id: 'p2', text: '垃圾每日 22:00 前清运', category: '卫生与清洁', binding: 'M2 · 自动生成日频任务', enforceable: true, rule: { type: 'shift', area: '垃圾清运' } },
      { id: 'p3', text: '公共消耗品保持 1 件安全库存', category: '公共物品', binding: 'M3 · 补货提醒阈值', enforceable: true, rule: { type: 'stock', value: 1 } },
      { id: 'p4', text: '账单确认时限 72 小时，超时视为通过', category: '费用与分摊', binding: 'M1 · 自动确认时限', enforceable: true, rule: { type: 'confirm', hours: CONFIRM_HOURS } },
      { id: 'p5', text: '安静时段 23:00–08:00，不弹横幅', category: '作息与噪音', binding: 'M5 · 该时段仅站内通知', enforceable: true, rule: { type: 'quiet', from: 23, to: 8 } },
      { id: 'p6', text: '马桶圈用完放下', category: '卫生与清洁', binding: '仅靠自觉，系统无法约束', enforceable: false, rule: null }
    ],
    votes: [
      { id: 'v1', text: '夏天空调统一设定为 26℃', support: ['m1', 'm2'], against: [], deadline: '2 天后截止', deadlineAt: Date.now() + 2 * 86400000, threshold: 2, closed: false, anonymous: false }
    ]
  };
}

/* ---- 迁移：从任意旧版本逐级升到 SCHEMA ---- */
/* v1 → v2：金额「元(浮点)」→「分(整数)」，并补齐缺失字段。
   原则：只加字段、只做无损换算，绝不改写语义。 */
const MIGRATIONS = {
  1: s => {
    const mid = (s.members || []).map(m => m.id);
    (s.bills || []).forEach(b => {
      b.amount = fen(b.amount);
      const sh = {};
      Object.keys(b.shares || {}).forEach(k => sh[k] = fen(b.shares[k]));
      b.shares = sh;
      b.participants = b.participants || mid.slice();
      b.period = b.period || String(b.date || '').slice(0, 7);
      b.dueAt = b.dueAt || null;
      b.history = b.history || [{ version: b.version || 1, at: Date.now(), by: b.payerId, what: '由旧版本数据迁移' }];
      b.meter = b.meter || null;
      b.weightSnapshot = b.weightSnapshot || (s.members || []).reduce((a, m) => (a[m.id] = m.weight, a), {});
    });
    (s.transfers || []).forEach(t => {
      t.amount = fen(t.amount);
      t.allocations = t.allocations || [];
      t.status = t.status || (t.receivedAt ? 'received' : 'pending');
    });
    (s.items || []).forEach(i => {
      i.restockQty = i.restockQty || (i.safety ? i.safety * 3 : 1);
      i.scope = i.scope || 'all';
    });
    s.restocks = s.restocks || [];
    s.scoreLog = s.scoreLog || [];
    s.voucher = s.voucher || {};
    (s.pacts || []).forEach(p => { if (p.rule === undefined) p.rule = null; });
    (s.votes || []).forEach(v => { v.closed = !!v.closed; v.deadlineAt = v.deadlineAt || Date.now(); });
    s.schemaVersion = 2;
    return s;
  }
};

function migrate(state) {
  let v = Number(state.schemaVersion) || 1;
  let guard = 0;
  while (v < SCHEMA) {
    const fn = MIGRATIONS[v];
    if (!fn) throw new Error('缺少 v' + v + ' 的迁移函数');
    state = fn(state);
    v = Number(state.schemaVersion);
    if (++guard > 20) throw new Error('迁移出现循环');
  }
  return state;
}

/* ---- 校验与修复：所有自动修复都记入 REPAIRS，绝不静默 ---- */
function validateState(s) {
  const fix = m => REPAIRS.push(m);
  if (!s || typeof s !== 'object') { fix('数据结构不是对象，已重建'); return null; }
  if (!Array.isArray(s.members)) { s.members = []; fix('成员列表损坏，已重置为空'); }
  if (!Array.isArray(s.bills)) { s.bills = []; fix('账单列表损坏，已重置为空'); }
  ['transfers', 'tasks', 'swaps', 'items', 'restocks', 'scoreLog', 'pacts', 'votes'].forEach(k => {
    if (!Array.isArray(s[k])) { s[k] = []; fix('「' + k + '」损坏，已重置为空'); }
  });
  if (!s.house || typeof s.house !== 'object') { s.house = { name: '我的合租屋' }; fix('房屋信息缺失，已补默认值'); }
  if (!s.voucher || typeof s.voucher !== 'object') s.voucher = {};
  if (!s.schemaVersion) s.schemaVersion = SCHEMA;

  const ids = s.members.map(m => m.id);
  if (ids.indexOf(s.me) < 0) { s.me = ids[0] || ''; }

  /* 金额：负值归零；份额与总额不一致时按总额重算，并记录 */
  s.bills.forEach(b => {
    if (!Number.isFinite(b.amount) || b.amount < 0) { b.amount = 0; fix('账单「' + b.title + '」金额非法，已归零'); }
    if (!b.shares || typeof b.shares !== 'object') b.shares = {};
    let sum = 0;
    (b.participants || ids).forEach(id => {
      let v = b.shares[id];
      if (!Number.isFinite(v) || v < 0) { v = 0; fix('账单「' + b.title + '」中某成员份额非法，已归零'); }
      b.shares[id] = v; sum += v;
    });
    if (sum !== b.amount && b.status !== 'settled') {
      b.shares = splitEven(b.amount, b.participants && b.participants.length ? b.participants : ids, b.payerId);
      fix('账单「' + b.title + '」份额之和不等于总额，已按总额重算');
    }
    if (!b.confirm || typeof b.confirm !== 'object') b.confirm = {};
    (b.participants || ids).forEach(id => { if (['pending', 'ok', 'dispute'].indexOf(b.confirm[id]) < 0) b.confirm[id] = 'pending'; });
  });

  /* 任务：日期格式与状态 */
  s.tasks.forEach(t => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t.date || '')) { t.date = todayStr(); fix('存在日期格式异常的值日任务，已改为今天'); }
    if (['pending', 'done', 'skipped', 'exempt'].indexOf(t.status) < 0) { t.status = 'pending'; fix('任务状态非法，已改为待办'); }
    if (!Array.isArray(t.checklist)) t.checklist = [];
  });

  /* 物品：库存为负归零 */
  s.items.forEach(i => {
    if (!Number.isFinite(i.stock) || i.stock < 0) { i.stock = 0; fix('物品「' + i.name + '」库存为负，已归零'); }
    if (!Number.isFinite(i.safety) || i.safety < 0) i.safety = 0;
    if (!Number.isFinite(i.restockQty) || i.restockQty <= 0) i.restockQty = Math.max(1, (i.safety || 1) * 3);
  });

  /* 转账：状态与分配 */
  s.transfers.forEach(t => {
    if (!Array.isArray(t.allocations)) t.allocations = [];
    if (!t.status) t.status = t.receivedAt ? 'received' : 'pending';
  });

  return s;
}

/* ---- 持久化 ---- */
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    return { ok: true };
  } catch (e) {
    const quota = /quota|exceed/i.test(String(e && e.name) + String(e && e.message));
    toast(quota ? '存储空间不足，请先导出备份并清理' : '本次改动未能保存（浏览器禁用了本地存储）');
    return { ok: false, err: e };
  }
}

function load() {
  REPAIRS = [];
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { STORAGE_OK = false; }
  if (!raw) { S = seed(); return { fresh: true }; }

  let parsed = null;
  try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }

  if (!parsed || typeof parsed !== 'object') {
    /* 数据损坏：备份原始串，交给用户决定，绝不静默重置 */
    try { localStorage.setItem(BAK + '_' + Date.now(), raw); } catch (e) { /* 备份失败也要继续 */ }
    STORAGE_BROKEN = raw;
    S = seed();
    return { broken: true };
  }

  try { parsed = migrate(parsed); }
  catch (e) {
    try { localStorage.setItem(BAK + '_' + Date.now(), raw); } catch (e2) { /* ignore */ }
    STORAGE_BROKEN = raw;
    S = seed();
    return { broken: true, reason: e.message };
  }

  const fromVersion = Number(parsed.schemaVersion);
  parsed = validateState(parsed) || seed();
  S = parsed;
  return { migrated: fromVersion < SCHEMA, fromVersion, repairs: REPAIRS.slice() };
}

let STORAGE_OK = true;
let STORAGE_BROKEN = null;

/* ---- 导出 / 导入 ---- */
function exportText() { return JSON.stringify(S, null, 2); }

function download(filename, text, mime) {
  try {
    const blob = new Blob([text], { type: mime || 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    return true;
  } catch (e) { return false; }
}

function importText(text) {
  let obj = null;
  try { obj = JSON.parse(text); } catch (e) { throw BizError('内容不是合法的 JSON'); }
  if (!obj || typeof obj !== 'object' || !Array.isArray(obj.members) || !Array.isArray(obj.bills)) {
    throw BizError('文件结构不对：缺少 members 或 bills');
  }
  const cur = Number(obj.schemaVersion) || 1;
  if (cur > SCHEMA) throw BizError('这份数据来自更新的版本（v' + cur + '），当前程序无法读取');
  let next = migrate(obj);
  REPAIRS = [];
  next = validateState(next) || seed();
  return next;
}

/* ============================================================
   2 · 计算层（全部以「分」为单位的整数运算）
   ============================================================ */
function splitEven(totalFen, ids, payerId) {
  const list = (ids || []).slice();
  if (!list.length) throw BizError('没有可参与分摊的成员');
  const total = Math.round(totalFen);
  const n = list.length;
  const base = Math.floor(total / n);
  const cents = {}; list.forEach(id => cents[id] = base);
  const rest = total - base * n;
  const holder = (payerId && list.indexOf(payerId) >= 0) ? payerId : list[0];
  cents[holder] += rest;                       // 尾差补给垫付人，保证之和严格等于总额
  const sum = list.reduce((a, id) => a + cents[id], 0);
  if (sum !== total) throw BizError('分摊结果未守恒，已阻止提交');
  return cents;
}

function splitWeight(totalFen, ids, payerId) {
  const list = (ids || []).slice();
  if (!list.length) throw BizError('没有可参与分摊的成员');
  const wsum = list.reduce((s, id) => s + (memberWeight(id) || 0), 0);
  if (wsum <= 0) throw BizError('所有成员的权重都为 0，无法按权重分摊');
  const total = Math.round(totalFen);
  const cents = {}; let used = 0;
  list.forEach((id, i) => {
    if (i === list.length - 1) { cents[id] = total - used; return; }
    const v = Math.round(total * (memberWeight(id) || 0) / wsum);
    cents[id] = v; used += v;
  });
  const sum = list.reduce((a, id) => a + cents[id], 0);
  if (sum !== total) throw BizError('分摊结果未守恒，已阻止提交');
  return cents;
}

function computeShares(amountFen, rule, payerId, participants) {
  const ids = participants && participants.length ? participants : S.members.map(m => m.id);
  return rule === 'weight' ? splitWeight(amountFen, ids, payerId) : splitEven(amountFen, ids, payerId);
}

const member = id => S.members.find(m => m.id === id) || { name: '?', id: id, weight: 1 };
const memberWeight = id => member(id).weight || 1;
const mName = id => member(id).name;
const mInit = id => mName(id).slice(-1);

function billStatusOf(b) {
  const ids = b.participants || S.members.map(m => m.id);
  const vals = ids.map(id => b.confirm[id]);
  if (vals.indexOf('dispute') >= 0) return 'disputed';
  if (vals.every(v => v === 'ok')) return 'unpaid';
  return 'confirming';
}

/* 净额（分）：正 = 别人欠我；负 = 我欠别人。
   只统计未结清账单的未清偿部分，并扣除「已转账但未确认收款」的部分。 */
function computeNet() {
  const net = {}; S.members.forEach(m => net[m.id] = 0);
  S.bills.filter(b => b.status === 'unpaid').forEach(b => {
    net[b.payerId] = (net[b.payerId] || 0) + (b.amount - (b.shares[b.payerId] || 0));
    S.members.forEach(m => { if (m.id !== b.payerId) net[m.id] = (net[m.id] || 0) - (b.shares[m.id] || 0); });
  });
  S.transfers.forEach(t => {
    if (t.status === 'void') return;
    net[t.from] = (net[t.from] || 0) + t.amount;
    net[t.to] = (net[t.to] || 0) - t.amount;
  });
  return net;
}

/* 最少转账方案：n 人最多 n-1 笔 */
function planTransfers(net) {
  const recv = [], pay = [];
  Object.keys(net).forEach(id => {
    if (net[id] > 0) recv.push({ id: id, v: net[id] });
    else if (net[id] < 0) pay.push({ id: id, v: -net[id] });
  });
  recv.sort((a, b) => b.v - a.v); pay.sort((a, b) => b.v - a.v);
  const out = []; let i = 0, j = 0;
  while (i < recv.length && j < pay.length) {
    const amt = Math.min(recv[i].v, pay[j].v);
    out.push({ from: pay[j].id, to: recv[i].id, amount: amt });
    recv[i].v -= amt; pay[j].v -= amt;
    if (recv[i].v === 0) i++;
    if (pay[j].v === 0) j++;
  }
  return out;
}

/* 逐账单判定结清：账单的每一份非垫付份额都必须有「已付款」的转账覆盖。
   取代原先「全屋净额为 0 就全部结清」的全局判定（那会误标互相抵消的账单）。 */
function billAllocated(billId, onlyReceived) {
  const got = {};
  S.transfers.forEach(t => {
    if (t.status === 'void') return;
    if (onlyReceived && t.status !== 'received') return;   // 未确认收款的不算真正清偿
    (t.allocations || []).forEach(a => {
      if (a.billId === billId) got[a.memberId] = (got[a.memberId] || 0) + a.amount;
    });
  });
  return got;
}

function checkSettled() {
  S.bills.forEach(b => {
    if (b.status !== 'unpaid') return;
    const ids = b.participants || S.members.map(m => m.id);
    const owe = ids.filter(id => id !== b.payerId);
    if (!owe.length) { b.status = 'settled'; return; }
    const got = billAllocated(b.id, true);
    const done = owe.every(id => (got[id] || 0) >= (b.shares[id] || 0));
    if (done) {
      b.status = 'settled';
      b.history = b.history || [];
      b.history.push({ version: b.version, at: Date.now(), by: null, what: '全部份额结清' });
    }
  });
}

/* 为「某笔转账」分配它到底清掉了哪些账单份额（贪心，先到先清） */
function allocateFor(from, to, amountFen) {
  const list = [];
  S.bills.forEach(b => {
    if (b.status !== 'unpaid') return;
    if (b.payerId !== to || from === b.payerId) return;
    const share = b.shares[from] || 0;
    if (share <= 0) return;
    const already = billAllocated(b.id, false)[from] || 0;
    const remain = share - already;
    if (remain > 0) list.push({ billId: b.id, memberId: from, amount: remain, title: b.title });
  });
  let left = amountFen;
  const out = [];
  for (let i = 0; i < list.length && left > 0; i++) {
    const take = Math.min(left, list[i].amount);
    out.push({ billId: list[i].billId, memberId: list[i].memberId, amount: take });
    left -= take;
  }
  return { allocations: out, leftover: left };
}

/* ============================================================
   3 · 时间与排班
   ============================================================ */
function startOfWeek(d) { const x = new Date(d); const off = (x.getDay() + 6) % 7; x.setDate(x.getDate() - off); x.setHours(0, 0, 0, 0); return x; }

function weekDates() {
  const mon = startOfWeek(new Date());
  const out = []; for (let i = 0; i < 7; i++) { const d = new Date(mon); d.setDate(mon.getDate() + i); out.push(ymd(d)); }
  return out;
}

/* 补齐本周任务；同时归档 90 天前的任务，避免数组无限增长 */
function ensureTasks() {
  /* 只有 1 名成员时不自动排班 —— 一个人给自己排值日表没有意义。
     新账号必须保持空白，等室友（邀请码加入后成员 ≥2）再生成。 */
  if (!S.members || S.members.length < 2) return;

  const week = weekDates();
  const today = todayStr();
  const exist = {}; S.tasks.forEach(t => { if (week.indexOf(t.date) >= 0) exist[t.date] = true; });
  week.forEach((ds, i) => {
    if (exist[ds]) return;
    const area = AREAS[i % AREAS.length];
    const who = S.members[i % S.members.length];
    S.tasks.push({
      id: uid('t'), area: area.name, date: ds, assigneeId: who.id, originalAssigneeId: who.id,
      status: ds < today ? 'done' : 'pending',
      checklist: area.list.map(x => ({ t: x, done: ds < today })),
      proofAt: ds < today ? '21:30' : null,
      isLateCheckin: false, verifiedBy: null, overdue: false,
      history: []
    });
  });
  /* 归档：超过 90 天且已完成的任务移出主数组（保留计数摘要） */
  const cut = ymd(new Date(Date.now() - 90 * 86400000));
  const old = S.tasks.filter(t => t.date < cut);
  if (old.length) {
    S.archived = S.archived || {};
    old.forEach(t => { if (t.status === 'done') S.archived[t.assigneeId] = (S.archived[t.assigneeId] || 0) + 1; });
    S.tasks = S.tasks.filter(t => t.date >= cut);
  }
  S.tasks.sort((a, b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
}

/* 每次渲染前跑一次：处理「确认超时」与「任务逾期」
   不依赖定时器 —— 后台标签页会被浏览器节流，定时器不可靠 */
function tick() {
  const now = Date.now();
  const today = todayStr();
  let changed = false;

  /* 账单确认超时 → 视为默认通过 */
  S.bills.forEach(b => {
    if (b.status !== 'confirming' || !b.dueAt) return;
    if (now < b.dueAt) return;
    b.confirm = b.confirm || {};
    (b.participants || []).forEach(id => { if (b.confirm[id] === 'pending') b.confirm[id] = 'ok'; });
    if (b.confirm['__timeout__'] !== true) {
      b.confirm['__timeout__'] = true;     // 标记「本次通过来自超时」而非人工确认
      b.history = b.history || [];
      b.history.push({ version: b.version, at: now, by: null, what: '确认超时（' + CONFIRM_HOURS + ' 小时），系统默认通过' });
    }
    b.status = billStatusOf(b);
    if (b.status === 'unpaid') changed = true;
  });

  /* 值日逾期 24 小时 → 顺延给下一顺位（只处理昨天及更早的未完成任务） */
  S.tasks.slice().forEach(t => {
    if (t.status !== 'pending' || t.date >= today) return;
    if (daysBetween(t.date, today) < 1) return;
    const idx = S.members.findIndex(m => m.id === t.assigneeId);
    const nxt = S.members[(idx + 1) % S.members.length];
    t.status = 'skipped';
    t.overdue = true;
    t.history = t.history || [];
    t.history.push({ at: now, what: '逾期未完成，已顺延' });
    /* 顺延：在下一个可用日期新建一条任务 */
    const free = S.members.find(m => m.id !== t.assigneeId) || nxt;
    S.tasks.push({
      id: uid('t'), area: t.area, date: today, assigneeId: free.id, originalAssigneeId: free.id,
      status: 'pending', checklist: (t.checklist || []).map(c => ({ t: c.t, done: false })),
      proofAt: null, isLateCheckin: false, verifiedBy: null, overdue: false,
      history: [{ at: now, what: '由 ' + dcn(t.date) + ' 的逾期任务顺延而来' }]
    });
    changed = true;
  });

  if (changed) save();
  return changed;
}

/* ============================================================
   4 · 贡献分（力账）
   ============================================================ */
const SCORE_RULES = {
  shift: { v: 10, why: '完成值日' },
  verified: { v: 2, why: '值日被验收通过' },
  purchase: { v: 8, why: '认领公共采购' },
  report: { v: 5, why: '上报需要维修的问题' },
  streak: { v: 15, why: '连续四周按时完成' }
};
/* 豁免券：每人每季度 1 张，可跳过 1 次值日 */
const VOUCHER_PER_QUARTER = 2;   // 每季度最多豁免 2 次值日
const VOUCHER_COST = 60;         // 每次豁免消耗的贡献分
const OFFSET_CAP = fen(30);      // 单次可抵扣的零头上限（元 → 分）

const quarterKey = () => { const d = new Date(); return d.getFullYear() + 'Q' + (Math.floor(d.getMonth() / 3) + 1); };

function scoreOf(memberId) {
  return (S.scoreLog || []).filter(x => x.memberId === memberId).reduce((a, x) => a + x.delta, 0);
}

function avgScore() {
  if (!S.members.length) return 0;
  return Math.round(S.members.reduce((a, m) => a + scoreOf(m.id), 0) / S.members.length);
}

function addScore(memberId, kind, note) {
  const r = SCORE_RULES[kind];
  if (!r) return;
  S.scoreLog = S.scoreLog || [];
  S.scoreLog.push({ id: uid('sc'), memberId: memberId, delta: r.v, reason: (r.why + (note ? '「' + note + '」' : '')), at: Date.now(), q: quarterKey() });
}

function vouchersLeft(memberId) {
  const q = quarterKey();
  const used = (S.voucher && S.voucher[memberId]) || {};
  return Math.max(0, VOUCHER_PER_QUARTER - (used[q] || 0));
}

function useVoucher(memberId) {
  if (vouchersLeft(memberId) <= 0) throw BizError('本季度豁免次数已用完（最多 ' + VOUCHER_PER_QUARTER + ' 次）');
  const have = scoreOf(memberId);
  if (have < VOUCHER_COST) throw BizError('贡献分不足，还差 ' + (VOUCHER_COST - have) + ' 分');
  S.scoreLog.push({ id: uid('sc'), memberId: memberId, delta: -VOUCHER_COST, reason: '兑换排班豁免', at: Date.now() });
  S.voucher = S.voucher || {};
  S.voucher[memberId] = S.voucher[memberId] || {};
  const q = quarterKey();
  S.voucher[memberId][q] = (S.voucher[memberId][q] || 0) + 1;
}

    h += `<p class="sub" style="margin:16px 0 8px;font-weight:800;color:var(--ink-2)">${g.n} · ${list.length}</p>`;
    list.slice(0, 30).forEach(b => {
      const mine = b.shares[me] || 0;
      const myState = b.confirm[me];
      const tag = b.status === 'confirming'
        ? (myState === 'pending' ? '<span class="pill o">待你确认</span>' : (myState === 'ok' ? '<span class="pill g">你已确认</span>' : '<span class="pill r">你已提出异议</span>'))
        : `<span class="pill ${STATUS_CLS[b.status]}">${STATUS_TXT[b.status]}</span>`;
      h += `<div class="card tap" data-act="bill" data-id="${b.id}">
        <div class="cr">
          <span class="tico money">¥</span>
          <div class="cr-b"><h3>${esc(b.title)}</h3>
            <p>${esc(mName(b.payerId))}垫付 ${fmt(b.amount)} · ${b.rule === 'even' ? '按人头均摊' : '按房间权重'}${b.version > 1 ? ' · v' + b.version : ''}</p>
          </div>
          <span class="amt">${fmt(mine)}</span>
        </div>
        <div class="kvmini">${tag}<span class="muted">我应付 ${fmt(mine)}</span></div>
      </div>`;
    });
    if (list.length > 30) h += `<p class="sub">仅显示最近 30 笔，共 ${list.length} 笔</p>`;
  });
  if (!any) h += `<div class="empty"><div class="em-ico">＋</div><b>还没有账单</b>点下面的按钮记下第一笔</div>`;
  h += `</div><button class="btn wide" data-act="newbill" type="button">＋ 新建账单</button>`;
  return h;
}

/* ---------- 结算中心 ---------- */
function viewSettle() {
  const me = S.me;
  const net = computeNet();
  const plan = planTransfers(net);
  const recv = S.transfers.filter(t => t.to === me && t.status === 'pending');
  const waitFor = S.transfers.filter(t => t.from === me && t.status === 'pending');

  let h = `<div class="sec">
    <div class="sec-h"><h2>结算中心</h2><span><button class="btn ghost sm" data-act="bills" type="button">返回账单</button></span></div>
    <div class="card tint">
      <p class="sub" style="margin:0">我的净额</p>
      <div class="big">${net[me] > 0 ? '+' + fmt(net[me]) : (net[me] < 0 ? '-' + fmt(-net[me]) : fmt(0))}</div>
      <p class="sub">逐笔债务已压缩为 ${plan.length} 笔转账（净额结算）</p>
    </div>

    <p class="sub" style="margin:16px 0 8px;font-weight:800;color:var(--ink-2)">最少转账方案 · ${plan.length} 笔</p>`;

  if (!plan.length) h += `<div class="card"><div class="cr"><span class="tico money">✓</span><div class="cr-b"><h3>当前没有待结清的债务</h3><p>所有账单均已结清</p></div></div></div>`;
  plan.forEach(p => {
    const mine = (p.from === me) ? 'from' : ((p.to === me) ? 'to' : '');
    const alloc = allocateFor(p.from, p.to, p.amount);
    const detail = alloc.allocations.map(a => {
      const b = S.bills.find(x => x.id === a.billId);
      return (b ? esc(b.title) : '已删除账单') + ' ' + fmt(a.amount);
    }).join('、');
    h += `<div class="card">
      <div class="cr">
        <span class="tico money">¥</span>
        <div class="cr-b"><h3>${esc(mName(p.from))} → ${esc(mName(p.to))}</h3>
        <p>${mine === 'from' ? '你需要转出' : (mine === 'to' ? '你将收到' : '与你无关的一笔')}${detail ? ' · 覆盖：' + detail : ''}</p></div>
        <span class="amt">${fmt(p.amount)}</span>
      </div>
      ${mine === 'from' ? `<div class="btnrow"><button class="btn sm" data-act="paid" data-from="${p.from}" data-to="${p.to}" data-amt="${p.amount}" type="button">我已转账</button></div>` : ''}
      ${mine === 'to' ? `<div class="btnrow"><button class="btn ghost sm" data-act="fakePaid" data-from="${p.from}" data-to="${p.to}" data-amt="${p.amount}" type="button">模拟对方已转账</button></div>` : ''}
    </div>`;
  });

  if (recv.length) {
    h += `<p class="sub" style="margin:16px 0 8px;font-weight:800;color:var(--ink-2)">待我确认收款 · ${recv.length}</p>`;
    recv.forEach(t => {
      h += `<div class="card"><div class="cr">
        <div><h3>${esc(mName(t.from))} 已转账给你</h3><p>标记时间 ${esc(t.paidAt)}</p></div>
        <span class="amt">${fmt(t.amount)}</span></div>
        <div class="btnrow">
          <button class="btn sm" data-act="recv" data-id="${t.id}" type="button">确认已收到</button>
          <button class="btn ghost sm" data-act="rejectTransfer" data-id="${t.id}" type="button">没收到</button>
        </div>
      </div>`;
    });
  }
  if (waitFor.length) {
    h += `<p class="sub" style="margin:16px 0 8px;font-weight:800;color:var(--ink-2)">我已转账，等待对方确认 · ${waitFor.length}</p>`;
    waitFor.forEach(t => {
      h += `<div class="card"><div class="cr">
        <div><h3>已转给 ${esc(mName(t.to))}</h3><p>等待对方确认收款</p></div>
        <span class="amt">${fmt(t.amount)}</span></div>
        <div class="btnrow"><button class="btn ghost sm" data-act="voidTransfer" data-id="${t.id}" type="button">撤回这笔转账</button></div></div>`;
    });
  }
  h += `</div>`;
  return h;
}

/* ---------- 值日 ---------- */
/* 值日卡片：本周表与「之后的排班」共用同一套渲染 */
function taskCardHtml(t, today) {
  const me = S.me;
  const isToday = t.date === today;
  const isMe = t.assigneeId === me;
  const overdueDay = t.status === 'pending' && t.date < today;
  const st = t.status === 'done' ? '<span class="pill g">已完成</span>'
    : (t.status === 'skipped' ? '<span class="pill r">已顺延</span>'
      : (overdueDay ? '<span class="pill r">已逾期</span>'
        : (isToday ? '<span class="pill o">今天 22:00 前</span>' : '<span class="pill">待办</span>')));
  const canCheck = isMe && t.status === 'pending' && t.date <= today && daysBetween(t.date, today) <= GRACE_DAYS;
  let h = `<div class="card ${isToday && isMe ? 'tint' : ''}">
    <div class="cr">
      <span class="tico shift">✓</span>
      <div class="cr-b"><h3>${esc(dcn(t.date))} ${esc(WD[new Date(t.date.replace(/-/g, '/')).getDay()])} · ${esc(t.area)}</h3>
        <p>负责人：${esc(mName(t.assigneeId))}${t.proofAt ? ' · ' + esc(t.proofAt) + ' 打卡' + (t.isLateCheckin ? '（补打）' : '') : ''}${isMe ? ' · 是你' : ''}</p></div>
      ${st}
    </div>
    <div class="btnrow${canCheck ? ' pri' : ''}">`;
  if (canCheck) {
    h += `<button class="btn sm" data-act="checkin" data-id="${t.id}" type="button">拍照打卡</button>
      <button class="btn ghost sm" data-act="swap" data-id="${t.id}" type="button">申请换班</button>`;
  }
  h += `<button class="btn link sm" data-act="editTask" data-id="${t.id}" type="button">编辑</button>`;
  h += `</div></div>`;
  return h;
}

function viewShift() {
  const me = S.me;
  const today = todayStr();
  const week = weekDates();
  const weekTasks = S.tasks.filter(t => week.indexOf(t.date) >= 0);
  const mine = weekTasks.filter(t => t.assigneeId === me);
  const doneN = weekTasks.filter(t => t.status === 'done').length;

  let h = `<div class="sec">
    <div class="sec-h"><h2>本周值日表</h2>
      <div class="sec-r"><span>共 ${weekTasks.length} 项 · 已完成 ${doneN} 项</span>
        <button class="mini-add" data-act="newTask" type="button" aria-label="新增排班" title="手动新增一条排班">＋</button></div>
    </div>`;

  week.forEach(ds => {
    const t = S.tasks.find(x => x.date === ds);
    if (t) h += taskCardHtml(t, today);
  });
  if (!weekTasks.length) {
    h += `<div class="card"><div class="cr">
      <span class="tico shift">✓</span>
      <div class="cr-b"><h3>本周还没有值日安排</h3>
        <p>${S.members.length < 2 ? '邀请室友加入房屋后，会自动生成本周值日表' : '点右上角的 ＋ 手动排一条'}</p></div>
    </div></div>`;
  }
  h += `</div>`;

  /* 本周之后的排班 —— 手动排了下周的任务必须能看到，否则会出现「加了却找不到」 */
  const future = S.tasks.filter(t => t.date > week[6]);
  if (future.length) {
    h += `<div class="sec">
      <div class="sec-h"><h2>之后的排班</h2>
        <div class="sec-r"><span>共 ${future.length} 项</span>
          <button class="mini-add" data-act="newTask" type="button" aria-label="新增排班" title="手动新增一条排班">＋</button></div>
      </div>`;
    future.forEach(t => { h += taskCardHtml(t, today); });
    h += `</div>`;
  }

  /* 力账：贡献分 */
  const myScore = scoreOf(me);
  const avg = avgScore();
  const diff = myScore - avg;
  h += `<div class="sec">
    <div class="sec-h"><h2>力账 · 贡献分</h2><span>本季度剩余豁免 ${vouchersLeft(me)} 次</span></div>
    <div class="card">
      <div class="cr">
        <span class="tico pact">分</span>
        <div class="cr-b"><h3>我的贡献分 ${myScore}</h3>
          <p>房屋平均 ${avg} 分 · ${diff > 0 ? '你比平均多做 ' + diff + ' 分' : (diff < 0 ? '比平均少 ' + (-diff) + ' 分' : '与平均持平')}</p></div>
      </div>
      <div class="btnrow">
        <button class="btn ghost sm" data-act="voucher" type="button">花费 ${VOUCHER_COST} 分豁免一次值日</button>
      </div>
      <p class="sub">豁免券用于跳过 1 次值日（每季度最多 ${VOUCHER_PER_QUARTER} 次）。分数不做公开排行，只对你自己可见</p>
    </div>
  </div>`;

  const swapIn = S.swaps.filter(s => s.to === me && s.status === 'pending');
  if (swapIn.length) {
    h += `<div class="sec"><div class="sec-h"><h2>待我响应的换班</h2></div>`;
    swapIn.forEach(s => {
      const tk = S.tasks.find(x => x.id === s.taskId) || { area: '', date: '' };
      h += `<div class="card"><div class="cr">
        <div><h3>${esc(mName(s.from))} 申请换班</h3><p>${esc(dcn(tk.date))} ${esc(tk.area)} · ${esc(s.reason || '未填写原因')}</p></div>
        <span class="pill o">待响应</span></div>
        <div class="btnrow pri">
          <button class="btn sm" data-act="swapOk" data-id="${s.id}" type="button">同意</button>
          <button class="btn ghost sm" data-act="swapNo" data-id="${s.id}" type="button">拒绝</button>
        </div></div>`;
    });
    h += `</div>`;
  }

  h += `<div class="sec"><div class="sec-h"><h2>本周我的任务</h2><span>${mine.length} 项</span></div>`;
  if (!mine.length) h += `<div class="empty"><div class="em-ico">☺</div><b>本周没有你的任务</b>${S.members.length < 2 ? '邀请室友加入后会自动排班' : '按轮值规则，下周会轮到你'}</div>`;
  mine.forEach(t => {
    h += `<div class="card"><div class="cr">
      <div><h3>${esc(dcn(t.date))} · ${esc(t.area)}</h3><p>${(t.checklist || []).map(c => esc(c.t)).join(' / ') || '未设置检查项'}</p></div>
      ${t.status === 'done' ? '<span class="pill g">已完成</span>' : (t.status === 'skipped' ? '<span class="pill r">已顺延</span>' : '<span class="pill o">待办</span>')}</div></div>`;
  });
  h += `</div>`;
  return h;
}
/* ---------- 物品 ---------- */
function activeRestock(itemId) {
  return S.restocks.find(r => r.itemId === itemId && (r.status === 'open' || r.status === 'claimed'));
}

function viewItems() {
  const me = S.me;
  const cats = ['消耗品', '共享设备'];
  const monthSpend = S.bills.filter(b => b.category === '日用品' && b.date.slice(0, 7) === todayStr().slice(0, 7))
    .reduce((s, b) => s + b.amount, 0);

  let h = `<div class="sec">
    <div class="sec-h"><h2>公共物品</h2>
      <div class="sec-r"><span>本月公共采购 ${fmt(monthSpend)}</span>
        <button class="mini-add" data-act="newItem" type="button" aria-label="添加物品" title="登记一件公共物品">＋</button></div>
    </div>`;

  if (!S.items.length) h += `<div class="empty"><div class="em-ico">□</div><b>还没有登记物品</b>把纸巾、洗洁精这类公用消耗品记进来
    <div class="btnrow" style="max-width:200px;margin:14px auto 0"><button class="btn sm" data-act="newItem" type="button">添加第一件</button></div></div>`;

  cats.forEach(c => {
    const list = S.items.filter(i => i.category === c);
    if (!list.length) return;
    h += `<p class="sub" style="margin:14px 0 8px;font-weight:800;color:var(--ink-2)">${c}</p>`;
    list.forEach(i => {
      const track = i.safety > 0;
      const need = track && i.stock <= i.safety;
      const low = track && !need && i.stock <= i.safety * 1.6;
      const pct = track ? Math.max(0, Math.min(100, Math.round(i.stock / (i.safety * 4) * 100))) : (i.stock > 0 ? 100 : 0);
      const badge = !track ? '<span class="pill">不追踪</span>'
        : (need ? '<span class="pill r">需采购</span>' : (low ? '<span class="pill o">偏低</span>' : '<span class="pill g">充足</span>'));
      const task = activeRestock(i.id);
      h += `<div class="card ${need && !task ? 'warn' : ''}">
        <div class="cr">
          <span class="tico ${c === '消耗品' ? 'item' : 'shift'}">${c === '消耗品' ? '物' : '器'}</span>
          <div class="cr-b"><h3>${esc(i.name)}</h3>
            <p>剩余 ${i.stock} ${esc(i.unit)} · 安全库存 ${i.safety} ${esc(i.unit)}${i.purchaserId ? ' · 采购负责人 ' + esc(mName(i.purchaserId)) : ''}</p>
          </div>${badge}
        </div>
        <div class="bar"><i class="${need ? 'r' : (low ? 'o' : '')}" style="width:${pct}%"></i></div>`;
      if (i.borrow) h += `<p class="sub">${esc(mName(i.borrow.by))} 借用中 · 预计 ${esc(i.borrow.due)} 归还</p>`;
      if (task) {
        h += `<p class="sub">${task.status === 'claimed' ? esc(mName(task.assigneeId)) + ' 已认领采购' : '待认领'}${
          me !== task.assigneeId && task.status === 'claimed' ? ' · <span class="linky" data-act="nudge" data-id="' + task.id + '">催一下</span>' : ''}</p>`;
      }
      h += `<div class="btnrow${(i.category === '消耗品' && (!task || task.status === 'open')) ? ' pri' : ''}">`;
      if (i.category === '消耗品') {
        h += `<button class="btn ghost sm" data-act="empty" data-id="${i.id}" type="button">快没了</button>`;
        if (!task || task.status === 'open') {
          h += `<button class="btn sm" data-act="buy" data-id="${i.id}" type="button">我去买</button>`;
        }
      }
      h += `<button class="btn link sm" data-act="editItem" data-id="${i.id}" type="button">编辑</button>`;
      h += `</div>`;
      h += `</div>`;
    });
  });
  h += `</div>`;
  return h;
}

/* ============================================================
   6 · 弹层（含无障碍：ESC 关闭 / 焦点管理 / 锁定背景滚动）
   ============================================================ */
let LAST_FOCUS = null;

function openSheet(html, forTab) {
  LAST_FOCUS = document.activeElement;
  const r = $('#modalRoot');
  r.dataset.for = forTab || TAB;
  r.innerHTML = `<div class="mask"><div class="sheet" tabindex="-1" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.style.overflow = 'hidden';
  document.body.classList.add('sheet-open');
  const sheet = r.querySelector('.sheet');
  if (sheet) setTimeout(() => { try { sheet.focus(); } catch (e) { /* ignore */ } }, 20);
}

function closeSheet() {
  const r = $('#modalRoot');
  if (!r.innerHTML) return;
  if (r.dataset.closing === '1') return;          /* 连点关闭时不重复触发 */

  const finish = () => {
    r.innerHTML = '';
    r.removeAttribute('data-for');
    r.removeAttribute('data-closing');
    document.body.style.overflow = '';
    document.body.classList.remove('sheet-open');
    if (LAST_FOCUS && typeof LAST_FOCUS.focus === 'function') { try { LAST_FOCUS.focus(); } catch (e) { /* ignore */ } }
    LAST_FOCUS = null;
  };

  const mask = r.querySelector('.mask');
  const sheet = r.querySelector('.sheet');
  /* 退出动画比进入更快（进场可慢，退场必须干脆）。
     不支持 Web Animations 的环境（jsdom、老浏览器）直接关闭，避免弹层卡住。 */
  if (!mask || !sheet || typeof sheet.animate !== 'function') { finish(); return; }

  r.dataset.closing = '1';
  const EASE = 'cubic-bezier(0.23, 1, 0.32, 1)';
  let done = false;
  const once = () => { if (done) return; done = true; finish(); };
  try {
    mask.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 170, easing: EASE, fill: 'forwards' });
    sheet.animate(
      [{ transform: 'none', opacity: 1 }, { transform: 'translateY(18px)', opacity: 0 }],
      { duration: 190, easing: EASE, fill: 'forwards' }
    ).finished.then(once).catch(once);
  } catch (e) { once(); return; }
  setTimeout(once, 320);   /* 兜底：动画结束事件丢失时也要关掉 */
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('on'), 2400);
}

function fail(e) {
  const msg = (e && e.name === 'BizError') ? e.message : '操作失败：' + ((e && e.message) || e);
  if (e && e.name !== 'BizError') console.error(e);
  toast(msg);
}

function fldHtml(f) {
  const id = 'f_' + f.k;

  if (f.type === 'select') {

      `<option value="${esc(x.v)}"${String(x.v) === String(f.value == null ? '' : f.value) ? ' selected' : ''}>${esc(x.t)}</option>`).join('')}</select>${hint}</div>`;
  }
  if (f.type === 'textarea') {
    return `<div class="field"><label for="${id}">${esc(f.label)}</label>
      <textarea id="${id}" rows="${f.rows || 2}" placeholder="${esc(f.ph || '')}">${esc(f.value == null ? '' : f.value)}</textarea>${hint}</div>`;
  }
  const attr = (f.min !== undefined ? ` min="${f.min}"` : '') + (f.max !== undefined ? ` max="${f.max}"` : '');
  return `<div class="field"><label for="${id}">${esc(f.label)}</label>

}

/* 检查清单文本 ↔ 数组（同名的项保留原有完成状态） */
function parseList(str, area, prev) {
  const s = String(str || '').trim();
  if (!s) {
    if (prev && prev.length) return prev.map(c => ({ t: c.t, done: !!c.done }));
    const def = AREAS.find(a => a.name === area);
    return (def ? def.list : ['完成公共区域清洁']).map(x => ({ t: x, done: false }));
  }
  const done = {};
  (prev || []).forEach(c => { done[c.t] = !!c.done; });
  return s.split(/[、,，;；|]+/).map(x => x.trim()).filter(Boolean).map(x => ({ t: x, done: !!done[x] }));
}

/* 数值字段的解析与范围校验（避免把空字符串变成 NaN 写进数据） */
function num(v, name, min, max) {
  const n = Number(v);
  if (!Number.isFinite(n)) throw BizError(name + '需要填数字');
  if (min !== undefined && n < min) throw BizError(name + '不能小于 ' + min);
  if (max !== undefined && n > max) throw BizError(name + '不能大于 ' + max);
  return n;
}

/* 公约改动后让版本号往前走一格 */
function bumpPactVersion() {
  const m = String(S.pactVersion || 'v1.0').match(/^v(\d+)\.(\d+)$/);
  S.pactVersion = m ? ('v' + m[1] + '.' + (Number(m[2]) + 1)) : 'v1.1';
}

/* 排班按日期排序（改了日期之后必须重排） */
function sortTasks() {
  S.tasks.sort((a, b) => (a.date < b.date ? -1 : (a.date > b.date ? 1 : 0)));
}

/* ---------- 结算单 ---------- */
function monthlyReport(period) {
  const bills = S.bills.filter(b => (b.period || String(b.date).slice(0, 7)) === period);
  const lines = [];
  lines.push('合租生活管家 · 月度结算单');
  lines.push('房屋：' + S.house.name + '    账期：' + period);
  lines.push('生成时间：' + timeTag());
  lines.push('');
  lines.push('一、本期账单（' + bills.length + ' 笔，合计 ' + fmt(bills.reduce((s, b) => s + b.amount, 0)) + '）');
  bills.forEach(b => {
    lines.push('  · ' + b.title + '  ' + fmt(b.amount) + '  垫付人：' + mName(b.payerId) + '  状态：' + STATUS_TXT[b.status]);
    (b.participants || []).forEach(id => {
      lines.push('      - ' + mName(id) + ' 应承担 ' + fmt(b.shares[id] || 0));
    });
  });
  const net = computeNet();
  lines.push('');
  lines.push('二、当前净额（正=应收，负=应付）');
  S.members.forEach(m => lines.push('  · ' + m.name + '：' + (net[m.id] > 0 ? '+' : '') + fmt(net[m.id])));
  const plan = planTransfers(net);
  lines.push('');
  lines.push('三、最少转账方案（' + plan.length + ' 笔）');
  if (!plan.length) lines.push('  已全部结清');
  plan.forEach(p => lines.push('  · ' + mName(p.from) + ' → ' + mName(p.to) + '  ' + fmt(p.amount)));
  return lines.join('\n');
}

function exitReport(memberId) {
  const net = computeNet();
  const n = net[memberId] || 0;
  const unpaid = S.bills.filter(b => b.status === 'unpaid' && (b.participants || []).indexOf(memberId) >= 0);
  const pending = S.tasks.filter(t => t.assigneeId === memberId && t.status === 'pending' && t.date >= todayStr());
  const mine = S.transfers.filter(t => t.from === memberId && t.status === 'pending');
  const lines = [];
  lines.push('合租生活管家 · 离场结算单');
  lines.push('房屋：' + S.house.name + '    成员：' + mName(memberId));
  lines.push('生成时间：' + timeTag());
  lines.push('');
  lines.push('一、资金');
  lines.push('  · 当前净额：' + (n > 0 ? '应收 ' + fmt(n) : (n < 0 ? '应付 ' + fmt(-n) : '已结清')));
  if (n < 0) lines.push('    建议：搬离前向垫付人支付 ' + fmt(-n) + '，或从押金中扣除');
  if (n > 0) lines.push('    建议：由其他成员补足 ' + fmt(n) + ' 后再办理离场');
  lines.push('  · 涉及未结清账单 ' + unpaid.length + ' 笔');
  mine.forEach(t => lines.push('  · 已标记转出但对方未确认：' + fmt(t.amount) + ' → ' + mName(t.to)));
  lines.push('');
  lines.push('二、未完成的值日（' + pending.length + ' 项）');
  if (!pending.length) lines.push('  无');
  pending.forEach(t => lines.push('  · ' + dcn(t.date) + ' ' + t.area));
  lines.push('');
  lines.push('三、确认');
  lines.push('  本单一经全体成员确认，该成员的所有债权债务即视为结清并归档。');
  return lines.join('\n');
}

  /* ---- 账单 ---- */
