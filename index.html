    sheetNewBill();
  },
  bill(el, id) { sheetBill(id); },

  createBill() {
    try {
      const title = ($('#nbTitle').value || '').trim() || '未命名账单';
      const amtFen = fen($('#nbAmt').value);
      if (amtFen <= 0) throw BizError('金额需要大于 0');
      if (amtFen > fen(1000000)) throw BizError('金额超过 100 万，请先确认输入是否正确');
      const payer = $('#nbPayer').value;
      if (!S.members.some(m => m.id === payer)) throw BizError('垫付人不在成员名单中');
      const rule = $('#nbRule').value;
      const participants = S.members.map(m => m.id);
      if (participants.length < 2) throw BizError('至少需要 2 名成员才能分摊');

      /* 幂等：防止双击/重复提交 */
      const dup = S.bills.find(b => b.title === title && b.amount === amtFen && (Date.now() - (b.createdAt || 0) < 60000));
      if (dup) throw BizError('一分钟内已经创建过一笔相同的账单');

      const shares = computeShares(amtFen, rule, payer, participants);   // 内部含守恒断言
      const confirm = {}; participants.forEach(id => confirm[id] = id === S.me ? 'ok' : 'pending');
      const now = Date.now();
      S.bills.unshift({
        id: uid('b'), title, category: $('#nbCat').value, amount: amtFen,
        payerId: payer, rule, participants,
        weightSnapshot: S.members.reduce((a, m) => (a[m.id] = m.weight || 1, a), {}),
        shares, confirm, status: 'confirming',
        date: todayStr(), period: todayStr().slice(0, 7), version: 1,
        dueAt: now + CONFIRM_HOURS * 3600000, createdAt: now,
        note: ($('#nbNote').value || '').trim(), meter: null,
        history: [{ version: 1, at: now, by: S.me, what: '创建账单' }]
      });
      save(); closeSheet(); toast('已创建，等待其他室友确认');
      TAB = 'bills'; BILLTAB = 'list'; render();
    } catch (e) { fail(e); }
  },

  ok(el, id) {
    try {
      const b = S.bills.find(x => x.id === id);
      if (!b) throw BizError('账单不存在');
      if (b.status !== 'confirming') throw BizError('该账单已不在待确认状态');
      if (b.confirm[S.me] === 'ok') throw BizError('你已经确认过这笔账了');
      b.confirm[S.me] = 'ok';
      b.status = billStatusOf(b);
      b.history = b.history || [];
      b.history.push({ version: b.version, at: Date.now(), by: S.me, what: '确认账单' });
      save(); closeSheet();
      toast(b.status === 'unpaid' ? '全员已确认，该笔进入待支付' : '已确认');
      render();
    } catch (e) { fail(e); }
  },

  dispute(el, id) {
    try {
      const b = S.bills.find(x => x.id === id);
      if (!b) throw BizError('账单不存在');
      if (b.status !== 'confirming') throw BizError('该账单已不在待确认状态');
      b.confirm[S.me] = 'dispute';
      b.status = 'disputed';
      b.history = b.history || [];
      b.history.push({ version: b.version, at: Date.now(), by: S.me, what: '提出异议' });
      save(); closeSheet(); toast('已提交异议，账单进入协商'); render();
    } catch (e) { fail(e); }
  },

  revise(el, id) {
    try {
      const b = S.bills.find(x => x.id === id);
      if (!b) throw BizError('账单不存在');
      if (b.status === 'settled') throw BizError('已结清的账单不能再修订，请另行发起一笔修正账单');
      /* 关键：用创建时的参与人与权重快照重算，不用当前成员表 */
      const parts = b.participants && b.participants.length ? b.participants : S.members.map(m => m.id);
      const sh = computeShares(b.amount, b.rule, b.payerId, parts);
      b.version += 1;
      b.shares = sh;
      b.confirm = {}; parts.forEach(id => b.confirm[id] = 'pending');
      b.status = 'confirming';
      b.dueAt = Date.now() + CONFIRM_HOURS * 3600000;
      b.history = b.history || [];
      b.history.push({ version: b.version, at: Date.now(), by: S.me, what: '提交修订（v' + (b.version - 1) + ' → v' + b.version + '）' });
      save(); closeSheet(); toast('已生成 v' + b.version + '，重新推送全员确认'); render();
    } catch (e) { fail(e); }
  },

  /* ---- 结算 ---- */
  paid(el) {
    try {
      const from = el.dataset.from, to = el.dataset.to;
      const amount = Number(el.dataset.amt);
      if (!(amount > 0)) throw BizError('转账金额异常');
      const dup = S.transfers.find(t => t.from === from && t.to === to && t.amount === amount && t.status === 'pending');
      if (dup) throw BizError('这笔转账已经标记过了，正在等待对方确认');
      const alloc = allocateFor(from, to, amount);
      S.transfers.push({
        id: uid('tr'), from, to, amount, allocations: alloc.allocations,
        paidAt: nowHM(), paidAtMs: Date.now(), receivedAt: null, status: 'pending', voidReason: null
      });
      save(); toast('已标记转账，等待对方确认收款' + (alloc.leftover > 0 ? '（含未归属金额 ' + fmt(alloc.leftover) + '）' : ''));
      render();
    } catch (e) { fail(e); }
  },

  fakePaid(el) {
    try {
      const from = el.dataset.from, to = el.dataset.to;
      const amount = Number(el.dataset.amt);
      if (!(amount > 0)) throw BizError('转账金额异常');
      const alloc = allocateFor(from, to, amount);
      S.transfers.push({
        id: uid('tr'), from, to, amount, allocations: alloc.allocations,
        paidAt: nowHM(), paidAtMs: Date.now(), receivedAt: null, status: 'pending', voidReason: null
      });
      save(); toast('模拟：' + mName(from) + ' 已标记转账'); render();
    } catch (e) { fail(e); }
  },

  recv(el, id) {
    try {
      const t = S.transfers.find(x => x.id === id);
      if (!t) throw BizError('转账记录不存在');
      if (t.status !== 'pending') throw BizError('这笔转账已经处理过了');
      t.status = 'received'; t.receivedAt = nowHM();
      checkSettled(); save(); toast('已确认收款，相关账单份额随之结清'); render();
    } catch (e) { fail(e); }
  },

  rejectTransfer(el, id) {
    try {
      const t = S.transfers.find(x => x.id === id);
      if (!t) throw BizError('转账记录不存在');
      if (t.status !== 'pending') throw BizError('这笔转账已经处理过了');
      t.status = 'void'; t.voidReason = '收款方表示未收到';
      save(); toast('已标记「未收到」，该笔转账作废，债务回到原状'); render();
    } catch (e) { fail(e); }
  },

  voidTransfer(el, id) {
    try {
      const t = S.transfers.find(x => x.id === id);
      if (!t) throw BizError('转账记录不存在');
      if (t.status !== 'pending') throw BizError('只有等待确认的转账才能撤回');
      t.status = 'void'; t.voidReason = '发起方主动撤回';
      save(); toast('已撤回该笔转账'); render();
    } catch (e) { fail(e); }
  },

  /* ---- 值日 ---- */
  checkin(el, id) { sheetCheckin(id); },
  swap(el, id) {
    try {
      const t = S.tasks.find(x => x.id === id);
      if (!t) throw BizError('任务不存在');
      if (t.status !== 'pending') throw BizError('该任务已完成，不需要换班');
      if (t.assigneeId !== S.me) throw BizError('只能换自己的任务');
      if (S.members.length < 2) throw BizError('房屋只有你一人，无人可换');
      if (S.swaps.some(s => s.taskId === t.id && s.status === 'pending')) throw BizError('该任务已有正在等待响应的换班申请');
      sheetSwap(id);
    } catch (e) { fail(e); }
  },

  doCheckin(el, id) {
    try {
      const t = S.tasks.find(x => x.id === id);
      if (!t) throw BizError('任务不存在');
      if (t.status !== 'pending') throw BizError('该任务已完成，不能重复打卡');
      if (t.assigneeId !== S.me) throw BizError('这不是你的任务');
      const today = todayStr();
      if (t.date > today) throw BizError('任务还没到日期，不能提前打卡');
      const gap = daysBetween(t.date, today);
      if (gap > GRACE_DAYS) throw BizError('已超过 ' + GRACE_DAYS + ' 天的补打期限');

      document.querySelectorAll('[data-chk]').forEach((b, i) => { if (t.checklist[i]) t.checklist[i].done = b.checked; });
      t.status = 'done';
      t.proofAt = nowHM();
      t.proofAtMs = Date.now();
      t.isLateCheckin = gap > 0;
      t.history = t.history || [];
      t.history.push({ at: Date.now(), what: (gap > 0 ? '补打' : '打卡完成') + '（' + nowHM() + '）' });
      addScore(S.me, 'shift', t.area);
      save(); closeSheet();
      toast('打卡成功，贡献分 +' + SCORE_RULES.shift.v);
      render();
    } catch (e) { fail(e); }
  },

  doSwap(el, id) {
    try {
      const t = S.tasks.find(x => x.id === id);
      if (!t) throw BizError('任务不存在');
      if (t.status !== 'pending') throw BizError('该任务已完成，不需要换班');
      if (t.assigneeId !== S.me) throw BizError('只能换自己的任务');
      if (S.swaps.some(s => s.taskId === t.id && s.status === 'pending')) throw BizError('该任务已有等待响应的换班申请');
      const to = $('#swTo').value;
      if (to === S.me) throw BizError('不能换给自己');
      if (!S.members.some(m => m.id === to)) throw BizError('对方不在成员名单中');
      S.swaps.push({ id: uid('sw'), taskId: t.id, from: S.me, to, reason: ($('#swReason').value || '').trim(), status: 'pending', at: Date.now() });
      save(); closeSheet();
      toast('换班申请已发送给 ' + mName(to) + '，切换身份即可响应');
      render();
    } catch (e) { fail(e); }
  },

  swapOk(el, id) {
    try {
      const s = S.swaps.find(x => x.id === id);
      if (!s) throw BizError('申请不存在');
      if (s.status !== 'pending') throw BizError('该申请已经处理过了');
      const t = S.tasks.find(x => x.id === s.taskId);
      if (!t) { s.status = 'voided'; save(); throw BizError('任务已不存在，申请自动作废'); }
      if (t.status !== 'pending') {
        s.status = 'voided'; save(); render();
        throw BizError('该任务已经完成，换班申请自动作废');
      }
      t.originalAssigneeId = t.originalAssigneeId || t.assigneeId;
      t.assigneeId = s.to;
      t.history = t.history || [];
      t.history.push({ at: Date.now(), what: mName(s.from) + ' 换班给 ' + mName(s.to) + '（' + s.reason + '）' });
      s.status = 'accepted'; s.respondedAt = Date.now();
      /* 同一任务的其它待响应申请一并作废 */
      S.swaps.forEach(x => { if (x.taskId === t.id && x.id !== s.id && x.status === 'pending') x.status = 'voided'; });
      save(); toast('已同意换班，排班已更新并留痕'); render();
    } catch (e) { fail(e); }
  },

  swapNo(el, id) {
    try {
      const s = S.swaps.find(x => x.id === id);
      if (!s) throw BizError('申请不存在');
      if (s.status !== 'pending') throw BizError('该申请已经处理过了');
      s.status = 'rejected'; s.respondedAt = Date.now();
      save(); toast('已拒绝换班申请'); render();
    } catch (e) { fail(e); }
  },

  voucher() {
    try { useVoucher(S.me); save(); toast('已获得一次值日豁免（下一项任务可跳过）'); render(); }
    catch (e) { fail(e); }
  },

  /* ---- 物品 ---- */
  empty(el, id) {
    try {
      const i = S.items.find(x => x.id === id);
      if (!i) throw BizError('物品不存在');
      i.stock = 0; i.days = 0;
      /* 确保存在一条待认领的补货任务 */
      if (!activeRestock(i.id)) {
        S.restocks.push({ id: uid('rk'), itemId: i.id, assigneeId: null, status: 'open', amount: 0, billId: null, claimedAt: null, doneAt: null, createdAt: Date.now() });
      }
      save();
      toast('已标记「快没了」，采购负责人 ' + mName(i.purchaserId) + ' 已收到提醒');
      render();
    } catch (e) { fail(e); }
  },

  buy(el, id) {
    try {
      const i = S.items.find(x => x.id === id);
      if (!i) throw BizError('物品不存在');
      const task = activeRestock(i.id);
      if (task && task.status === 'claimed' && task.assigneeId !== S.me) throw BizError(mName(task.assigneeId) + ' 已经认领了这项采购');
      if (task && task.status === 'claimed' && task.assigneeId === S.me) { /* 自己认领过，继续购买 */ }
      else if (!task) {
        S.restocks.push({ id: uid('rk'), itemId: i.id, assigneeId: S.me, status: 'claimed', amount: 0, billId: null, claimedAt: Date.now(), doneAt: null, createdAt: Date.now() });
      } else {
        task.assigneeId = S.me; task.status = 'claimed'; task.claimedAt = Date.now();
      }
      save();
      sheetBuy(id);
    } catch (e) { fail(e); }
  },

  doBuy(el, id) {
    try {
      const i = S.items.find(x => x.id === id);
      if (!i) throw BizError('物品不存在');
      const amtFen = fen($('#buyAmt').value);
      if (amtFen <= 0) throw BizError('请填写实际花费');
      const participants = S.members.map(m => m.id);
      if (participants.length < 1) throw BizError('没有可分摊的成员');
      const shares = computeShares(amtFen, 'even', S.me, participants);
      const confirm = {}; participants.forEach(mid => confirm[mid] = mid === S.me ? 'ok' : 'pending');
      const now = Date.now();
      const billId = uid('b');
      S.bills.unshift({
        id: billId, title: '公共采购 · ' + i.name, category: '日用品', amount: amtFen,
        payerId: S.me, rule: 'even', participants,
        weightSnapshot: S.members.reduce((a, m) => (a[m.id] = m.weight || 1, a), {}),
        shares, confirm, status: 'confirming',
        date: todayStr(), period: todayStr().slice(0, 7), version: 1,
        dueAt: now + CONFIRM_HOURS * 3600000, createdAt: now,
        note: '由物品模块自动生成', meter: null,
        history: [{ version: 1, at: now, by: S.me, what: '由采购任务自动生成' }]
      });
      const task = activeRestock(i.id);
      if (task) { task.status = 'done'; task.assigneeId = S.me; task.amount = amtFen; task.billId = billId; task.doneAt = now; }
      i.stock = i.restockQty || Math.max(1, i.safety * 3);
      i.days = 30;
      addScore(S.me, 'purchase', i.name);
      save(); closeSheet();
      toast('已生成账单并回补库存到 ' + i.stock + ' ' + i.unit + '，贡献分 +' + SCORE_RULES.purchase.v);
      TAB = 'items'; render();
    } catch (e) { fail(e); }
  },

  nudge(el, id) {
    const r = S.restocks.find(x => x.id === id);
    toast(r ? '已提醒 ' + mName(r.assigneeId) : '已提醒');
  },

  vote(el, id) {
    try {
      const v = S.votes.find(x => x.id === id);
      if (!v) throw BizError('提案不存在');
      if (v.closed) throw BizError('该提案已结束投票');
      const yes = el.dataset.v === '1';
      const add = yes ? 'support' : 'against', del = yes ? 'against' : 'support';
      const at = v[add].indexOf(S.me);
      if (at >= 0) v[add].splice(at, 1);
      else { v[add].push(S.me); const d = v[del].indexOf(S.me); if (d >= 0) v[del].splice(d, 1); }
      save(); render();
    } catch (e) { fail(e); }
  },

  /* ---- 数据管理 ---- */
  exportData() {
    const text = exportText();
    const name = 'roomies-backup-' + todayStr() + '.json';
    if (download(name, text, 'application/json')) toast('已导出备份文件');
    else sheetText('导出备份（手动保存）', text);
  },

  importData() {
    try {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.json,application/json';
      inp.onchange = () => {
        const f = inp.files && inp.files[0];
        if (!f) return;
        const fr = new FileReader();
        fr.onload = () => {
          try {
            const cur = S;
            const next = importText(String(fr.result));
            next.me = next.members.some(m => m.id === cur.me) ? cur.me : (next.members[0] || {}).id;
            S = next;
            REPAIRS = [];
            checkSettled();
            const rs = save();
            if (!rs.ok) throw BizError('导入成功但未能写入本地存储');
            closeSheet(); render();
            toast('导入成功：' + S.bills.length + ' 笔账单、' + S.members.length + ' 名成员');
          } catch (e) { fail(e); }
        };
        fr.onerror = () => toast('读取文件失败');
        fr.readAsText(f);
      };
      inp.click();
    } catch (e) { fail(e); }
  },

  monthlyReport() {
    try { sheetText('月度结算单 · ' + todayStr().slice(0, 7), monthlyReport(todayStr().slice(0, 7))); }
    catch (e) { fail(e); }
  },

  exitReport() {
    const opts = S.members.map(m => `<option value="${m.id}">${esc(m.name)} · ${esc(m.room)}</option>`).join('');
    openSheet(`
      <h3>生成离场结算单</h3>
      <p class="sh-sub">用于成员搬离时结清债权债务，生成后请由其余成员共同确认</p>
      <div class="field"><label for="exitWho">要结算哪位成员</label><select id="exitWho">${opts}</select></div>
      <div class="btnrow">
        <button class="btn link" data-act="close" type="button">取消</button>
        <button class="btn" data-act="doExitReport" type="button">生成结算单</button>
      </div>
    `);
  },

  doExitReport() {
    try {
      const id = $('#exitWho').value;
      if (!S.members.some(m => m.id === id)) throw BizError('成员不存在');
      sheetText('离场结算单 · ' + mName(id), exitReport(id));
    } catch (e) { fail(e); }
  },

  copyText() {
    const ta = $('#txtOut');
    if (!ta) return;
    try { ta.select(); document.execCommand('copy'); toast('已复制到剪贴板'); }
    catch (e) { toast('复制失败，请手动选择文本后复制'); }
  },

  downloadText() {
    if (download('roomies-' + todayStr() + '.txt', LAST_TEXT, 'text/plain')) toast('已下载');
    else toast('当前环境不支持下载，请手动复制');
  },

  resetAsk() {
    sheetConfirm('清空这间房屋的全部数据？', [
      '账单、值日、物品、公约记录都会被删除',
      '房屋会回到刚创建时的空白状态',
      '这个动作无法自动撤销，建议先「导出备份」'
    ], '确认清空', 'resetDo', null, true);
  },

  resetDo() {
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    /* 客户端语义：清空后回到空白房屋，而不是载入演示数据 */
    S = emptyState(CURRENT || { name: '我' });
    REPAIRS = [];
    save();
    TAB = 'home'; BILLTAB = 'list';
    closeSheet(); render();
    toast('已清空，房屋恢复空白');

  brokenNotice() {
    closeSheet();
    const raw = STORAGE_BROKEN;
    if (!raw) return;
    sheetText('原始数据副本', raw);
  }

function makeStars(n) {
  let h = '';
  for (let i = 0; i < n; i++) {
    const x = (Math.random() * 100).toFixed(2);
    const y = (Math.random() * 58).toFixed(2);
    const d = (Math.random() * 4).toFixed(1);
    const big = Math.random() > 0.84;
    h += `<span class="star${big ? ' big' : ''}" style="left:${x}%;top:${y}%;animation-delay:${d}s"></span>`;
  }
  return h;
}

/* ============================================================
   1 · 主题：晴天 / 夜空（跟随时间 + 可手动覆盖）
   ============================================================ */
const THEME_KEY = 'roomies_theme';
const THEME_MODES = ['auto', 'day', 'night'];
let themeMode = 'auto';

function autoTheme() {
  const h = new Date().getHours();
  return (h >= 18 || h < 6) ? 'night' : 'day';
}
function currentTheme() { return themeMode === 'auto' ? autoTheme() : themeMode; }
function applyTheme() {
  const t = currentTheme();
  document.documentElement.dataset.theme = t;
  const btn = document.getElementById('btnTheme');
  if (btn) btn.title = themeMode === 'auto'
    ? '主题：跟随时间（现在' + (t === 'day' ? '晴天' : '夜空') + '）· 点击切换'
    : (themeMode === 'day' ? '主题：已锁定晴天 · 点击切换' : '主题：已锁定夜空 · 点击切换');
}
function cycleTheme() {
  /* 点一下必须看到变化：从「跟随时间」切到与当前相反的手动模式，其余情况直接翻转。
     否则在白天点按钮会毫无反应，用户会以为坏了。 */
  if (themeMode === 'auto') themeMode = currentTheme() === 'day' ? 'night' : 'day';
  else themeMode = themeMode === 'day' ? 'night' : 'day';
  try { localStorage.setItem(THEME_KEY, themeMode); } catch (e) { /* ignore */ }
  applyTheme();
  toast(themeMode === 'night' ? '夜空模式 ☾' : '晴天模式 ☀');
}
function setThemeMode(m) {
  themeMode = m;
  try { localStorage.setItem(THEME_KEY, m); } catch (e) { /* ignore */ }
  applyTheme();
}
function initTheme() {
  try { const v = localStorage.getItem(THEME_KEY); if (THEME_MODES.indexOf(v) >= 0) themeMode = v; } catch (e) { /* ignore */ }
  applyTheme();
  /* 跨过 18:00 / 6:00 时自动换装（不依赖渲染） */
  setInterval(() => { if (themeMode === 'auto') applyTheme(); }, 300000);
}

/* ============================================================
   2 · 账号体系
   ============================================================ */
const ACC_KEY = 'roomies_accounts';
const SESSION_KEY = 'roomies_session';
const DATA_PREFIX = 'roomies_data_';
const GLYPHS = ['☀', '☾', '★', '✦', '☁', '◐'];

let CURRENT = null;
let AUTH_STEP = 'pick';     // pick | pw | new
let AUTH_TARGET = null;     // 选中的账号

function getAccounts() {
  try { const a = JSON.parse(localStorage.getItem(ACC_KEY)); return Array.isArray(a) ? a : []; } catch (e) { return []; }
}
function setAccounts(list) {
  try { localStorage.setItem(ACC_KEY, JSON.stringify(list)); return true; } catch (e) { return false; }
}
function getSession() { try { return localStorage.getItem(SESSION_KEY) || ''; } catch (e) { return ''; } }
function setSession(id) {
  try { if (id) localStorage.setItem(SESSION_KEY, id); else localStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ }
}

/* 密码只保存加盐哈希；Web Crypto 不可用时（如 file:// 打开）降级并提示 */
async function hashPw(pw, salt) {
  const raw = salt + '::' + pw;
  if (window.crypto && window.crypto.subtle && window.TextEncoder) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
      return 'sha256:' + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { /* 落到降级分支 */ }
  }
  let h = 5381;
  for (let i = 0; i < raw.length; i++) h = ((h << 5) + h) ^ raw.charCodeAt(i);
  return 'weak:' + (h >>> 0).toString(16);
}

const avaBg = a => `background:linear-gradient(135deg, hsl(${a.hue} 76% 62%), hsl(${(a.hue + 42) % 360} 70% 48%))`;
const avaGlyph = a => a.glyph || '★';

function demoDataExists() {
  try { return !!localStorage.getItem('roomies_demo_v1'); } catch (e) { return false; }
}

/* ---- 邀请码 ---- */
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 去掉易混的 I / O / 0 / 1
function genCode() {
  let s = '';
  for (let i = 0; i < 6; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return s;
}
const keyOf = acc => DATA_PREFIX + ((acc && acc.houseOwnerId) || (acc && acc.id));

/* 在本机所有房屋里按邀请码找 */
function findHouseByCode(code) {
  code = String(code || '').trim().toUpperCase();
  if (code.length !== 6) return null;
  const accs = getAccounts();
  for (let i = 0; i < accs.length; i++) {
    const owner = accs[i].houseOwnerId || accs[i].id;
    let raw = null;
    try { raw = localStorage.getItem(DATA_PREFIX + owner); } catch (e) { continue; }
    if (!raw) continue;
    let st = null;
    try { st = JSON.parse(raw); } catch (e) { continue; }
    if (st && st.house && st.house.inviteCode === code) {
      return { owner: owner, state: st, ownerAcc: accs[i] };
    }
  }
  return null;
}

/* 把新成员写进目标房屋，返回其成员 id */
function addMemberToHouse(found, name) {
  const st = found.state;
  st.members = st.members || [];
  if (!st.house.inviteCode) st.house.inviteCode = genCode();
  const nid = 'm' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
  st.members.push({ id: nid, name: name, room: '', weight: 1, joinedAt: todayStr() });
  try { localStorage.setItem(DATA_PREFIX + found.owner, JSON.stringify(st)); } catch (e) { /* ignore */ }
  return nid;
}

/* ---- 房屋初始化：认领旧数据 还是 开一间空屋 ---- */
function emptyState(acc) {
  const ds = todayStr();
  const s = seed();                      // 只沿用字段结构，业务数据一律清空
  /* 房屋名：注册时填了就用它，否则退回「昵称 + 的合租屋」 */
  const hName = String((acc && acc.houseName) || '').trim();
  s.house = { name: hName || ((acc.name || '我') + '的合租屋'), inviteCode: genCode() };
  s.members = [{ id: 'm1', name: acc.name || '我', room: '主卧', weight: 1, joinedAt: ds }];
  s.me = 'm1';
  s.bills = []; s.transfers = []; s.tasks = []; s.swaps = [];
  s.items = []; s.restocks = []; s.scoreLog = []; s.votes = [];
  /* 公约与版本也必须清空：新房屋不该带着别人的条款进来 */
  s.pacts = [];
  s.pactVersion = 'v1.0';
  s.archived = {};
  s.voucher = {};
  return s;
}

/* 首次进入某账号的数据空间时决定装什么内容。
   注意：不勾选「载入本机数据」就必须是空房屋，不能再落到演示数据上。 */
function ensureAccountData(acc) {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { /* ignore */ }
  if (raw) return 'existing';

  const canClaim = demoDataExists();
  let init = null, mode = 'blank';
  if (acc.claimDemo && canClaim) {
    try { init = localStorage.getItem('roomies_demo_v1'); } catch (e) { init = null; }
    if (init) mode = 'claimed';
  }
  if (!init) init = JSON.stringify(emptyState(acc));
  try { localStorage.setItem(KEY, init); } catch (e) { /* ignore */ }
  return mode;
}

/* 老房屋补邀请码（升级已有数据时用） */
function ensureInviteCode() {
  if (!S || !S.house) return;
  if (!S.house.inviteCode) { S.house.inviteCode = genCode(); save(); }
}

async function register(name, pw, pw2, claimDemo, inviteCode, houseName) {
  name = String(name || '').trim();
  if (name.length < 2) throw BizError('昵称至少 2 个字');
  if (name.length > 12) throw BizError('昵称不要超过 12 个字');
  if (pw.length < 6) throw BizError('密码至少 6 位');
  if (pw !== pw2) throw BizError('两次输入的密码不一致');
  const list = getAccounts();
  if (list.some(a => a.name === name)) throw BizError('这个昵称已经被使用了');

  const code = String(inviteCode || '').trim().toUpperCase();
  if (code && code.length !== 6) throw BizError('邀请码是 6 位');
  /* 房屋名只在「创建」时才有意义；「加入」时沿用屋主的房屋名，忽略传入值 */
  const hName = String(houseName || '').trim();
  if (!code && hName.length > 12) throw BizError('房屋名称不要超过 12 个字');

  const salt = uid('s');
  const hash = await hashPw(pw, salt);
  const acc = {
    id: uid('a'), name: name, salt: salt, hash: hash,
    hue: Math.floor(Math.random() * 360),
    glyph: GLYPHS[Math.floor(Math.random() * GLYPHS.length)],
    createdAt: Date.now(), lastLoginAt: null,
    houseOwnerId: null, memberId: null, claimDemo: !!claimDemo,
    houseName: code ? '' : hName
  };

  let joined = false;
  if (code) {
    const found = findHouseByCode(code);
    if (!found) throw BizError('邀请码无效，本机没有这个房屋');
    acc.houseOwnerId = found.owner;
    acc.memberId = addMemberToHouse(found, name);
    joined = true;
  } else {
    acc.houseOwnerId = acc.id;      // 自己开一间，数据空间就是自己的
    acc.memberId = 'm1';
  }

  list.push(acc);
  if (!setAccounts(list)) throw BizError('无法写入本地存储，请检查浏览器设置');
  return { acc: acc, joined: joined };
}

async function verify(acc, pw) {
  const h = await hashPw(pw, acc.salt);
  return h === acc.hash;
}

function removeAccount(id) {
  const list = getAccounts().filter(a => a.id !== id);
  setAccounts(list);
  try { localStorage.removeItem(DATA_PREFIX + id); } catch (e) { /* ignore */ }
  if (getSession() === id) setSession('');
}

function touchLogin(acc) {
  acc.lastLoginAt = Date.now();
  const list = getAccounts();
  const i = list.findIndex(a => a.id === acc.id);
  if (i >= 0) { list[i] = acc; setAccounts(list); }
}

function relTime(ts) {
  if (!ts) return '尚未登录过';
  const d = Math.floor((Date.now() - ts) / 1000);
  if (d < 60) return '刚刚登录过';
  if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
  if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
  if (d < 86400 * 30) return Math.floor(d / 86400) + ' 天前';
  const dt = new Date(ts);
  return (dt.getMonth() + 1) + ' 月 ' + dt.getDate() + ' 日';
}

   ============================================================ */
function enterApp(acc) {
  CURRENT = acc;
  touchLogin(acc);
  setSession(acc.id);
  KEY = keyOf(acc);                       // 加入别人房屋时，读写的是屋主的数据空间

  const shell = $('#appShell'), stage = $('#authStage');
  if (stage) stage.classList.add('hide');
  if (shell) shell.classList.remove('hide');

  const avaTop = $('#avaTop');
  if (avaTop) { avaTop.style.cssText += ';' + avaBg(acc); avaTop.textContent = avaGlyph(acc); }

  REPAIRS = [];
  const initMode = ensureAccountData(acc);  // 空屋 / 认领旧数据，二者只能取其一
  const boot = load();
  if (acc.memberId && S.members.some(m => m.id === acc.memberId)) S.me = acc.memberId;
  ensureTasks();
  ensureInviteCode();
  checkSettled();
  save();
  render();
  syncHouseHeader();
  window.scrollTo(0, 0);

  if (initMode === 'claimed') {
    setTimeout(() => toast('已载入本机原有数据'), 420);
  } else if (boot && boot.broken) {
    setTimeout(() => openSheet(`
      <h3>本地数据异常</h3>
      <p class="sh-sub">这个账号的数据无法读取，已保留原始副本，当前显示的是演示数据</p>
      <div class="btnrow" style="margin-top:16px">
        <button class="btn ghost" data-act="brokenNotice" type="button">查看原始副本</button>
        <button class="btn primary" data-act="close" type="button">知道了</button>
      </div>`), 420);
  } else if (boot && boot.repairs && boot.repairs.length) {
    setTimeout(() => toast('已自动修复 ' + boot.repairs.length + ' 处数据异常'), 480);
  }
}

function syncHouseHeader() {

      <div style="min-width:0">
        <h3 style="margin:0">${esc(CURRENT.name)}</h3>
        <p class="sh-sub" style="margin:2px 0 0">账号创建于 ${esc(relTime(CURRENT.createdAt).replace('登录过', '创建'))}</p>
      </div>
    </div>
    <div class="divide"></div>

    <p class="sub" style="font-weight:800;color:var(--ink-2);margin:0 0 8px">房屋成员</p>
    <div class="rowlist">
      ${(S.members || []).map(m => `<div class="rowitem">
        <span class="nm"><span class="av">${esc(mInit(m.id))}</span>${esc(m.name)} · ${esc(m.room || '')}${m.id === S.me ? '<span class="pill b">我</span>' : ''}</span>
      </div>`).join('')}
    </div>

    <div class="divide"></div>
    <p class="sub" style="font-weight:800;color:var(--ink-2);margin:0 0 8px">房屋邀请码</p>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="font-size:24px;font-weight:800;letter-spacing:6px;font-variant-numeric:tabular-nums">${esc((S.house && S.house.inviteCode) || '------')}</span>
      <button class="btn ghost sm" data-act="copyCode" type="button">复制</button>
    </div>

    <div class="divide"></div>
    <p class="sub" style="font-weight:800;color:var(--ink-2);margin:0 0 8px">外观</p>
    <div class="rowitem">
      <span class="nm"><span class="av">${themeMode === 'night' ? '☾' : (themeMode === 'day' ? '☀' : '◐')}</span>主题：${modeTxt}</span>
      <button class="btn ghost sm" data-act="cycleTheme" type="button">切换</button>
    </div>
    ${themeMode === 'auto' ? '' : `<div class="btnrow"><button class="btn ghost sm" data-act="themeAuto" type="button">恢复「跟随时间」</button></div>`}

    <div class="divide"></div>
    <div class="btnrow">
      <button class="btn ghost" data-act="logout" type="button">退出登录</button>
      <button class="btn danger" data-act="askDelAccount" data-id="${CURRENT.id}" type="button">删除账号</button>
    </div>
    <div class="btnrow"><button class="btn link" data-act="close" type="button">关闭</button></div>
  `);
}

/* ============================================================
   6 · 动作扩展
   ============================================================ */
Object.assign(ACT, {
  pickAccount(el, id) {
    const a = getAccounts().filter(x => x.id === id)[0];
    if (!a) { toast('账号不存在'); return; }
    AUTH_TARGET = a; AUTH_STEP = 'pw'; renderAuth();
  },
  authPick() { AUTH_STEP = 'pick'; AUTH_TARGET = null; renderAuth(); },
  authNew() { AUTH_STEP = 'new'; AUTH_TARGET = null; renderAuth(); },

  askDelAccount(el, id) {
    const a = getAccounts().filter(x => x.id === id)[0];
    if (!a) return;
    sheetConfirm('删除账号「' + a.name + '」？', [
      '这个账号的记录会被永久清除，无法恢复',
      '如果想保留，请先进入该账号并导出备份'
    ], '确认删除', 'delAccount', id, true);
  },
  delAccount(el, id) {
    removeAccount(id);
    closeSheet();
    if (CURRENT && CURRENT.id === id) { logout(); }
    else { AUTH_STEP = 'pick'; renderAuth(); toast('账号已删除'); }
  },

  cycleTheme() { cycleTheme(); closeSheet(); if (CURRENT) sheetAccount(); },
  themeAuto() { setThemeMode('auto'); closeSheet(); if (CURRENT) sheetAccount(); toast('已恢复跟随时间'); },
  logout() { logout(); },
  accountMenu() { sheetAccount(); },
  copyCode() {
    const code = (S && S.house && S.house.inviteCode) || '';
    if (!code) { toast('还没有邀请码'); return; }
    const done = () => toast('邀请码已复制：' + code);
    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = code;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        done();
      } catch (e) { toast('邀请码：' + code); }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done, fallback);
        return;
      }
    } catch (e) { /* 落到 fallback */ }
    fallback();
  }
});

/* ============================================================
   7 · 事件绑定与启动
   ============================================================ */
document.addEventListener('click', e => {
  const t = e.target;
  if (t && t.classList && t.classList.contains('mask')) { closeSheet(); return; }
  const el = t && t.closest ? t.closest('[data-act]') : null;
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, el.dataset.id, e); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modalRoot').innerHTML) { e.preventDefault(); closeSheet(); }
});

/* 多标签页同步（同一账号在另一标签页改动了数据） */
window.addEventListener('storage', e => {
  if (!CURRENT) return;
  if (e.key !== KEY || !e.newValue) return;
  try { load(); REPAIRS = []; checkSettled(); closeSheet(); render(); toast('数据已在其他标签页更新，已同步'); }
  catch (err) { /* 保持原状优于崩溃 */ }
});

const btnTheme = $('#btnTheme');
if (btnTheme) btnTheme.addEventListener('click', cycleTheme);
const btnAccount = $('#btnAccount');
if (btnAccount) btnAccount.addEventListener('click', sheetAccount);

/* ---- 启动 ---- */
initTheme();
const stars = $('#stars');
/* 28 颗足够铺满夜空 —— 每颗都是一个独立合成层，数量直接换算力开销 */
if (stars) stars.innerHTML = makeStars(28);

/* 流星：位置与轨迹写死在 CSS 的三颗（m1/m2/m3）里，这里只负责补上旋转角度。
   角度必须按视口实际比例换算 —— vw 与 vh 对应的像素差很多（窄屏上 1vh 远大于 1vw），
   直接写角度常量会让尾巴倾角和飞行轨迹对不上。 */
const meteors = document.querySelectorAll('.meteor');
if (meteors.length) {
  const alignAngle = () => {
    const w = window.innerWidth || 390, h = window.innerHeight || 844;
    meteors.forEach(m => {
      const cs = getComputedStyle(m);
      const mdx = parseFloat(cs.getPropertyValue('--mdx')) || 60;   // 水平位移 (vw)
      const mdy = parseFloat(cs.getPropertyValue('--mdy')) || 40;   // 垂直位移 (vh)
      const ang = Math.atan2(mdy * h / 100, mdx * w / 100) * 180 / Math.PI;
      m.style.setProperty('--mrot', (isFinite(ang) ? ang : 36).toFixed(1) + 'deg');
    });
  };
  alignAngle();
  window.addEventListener('resize', alignAngle);
}
const logoAuth = $('#logoAuth');
if (logoAuth) logoAuth.innerHTML = logoSVG();
const logoTop = $('#logoTop');
if (logoTop) logoTop.innerHTML = logoSVG();

(function boot() {
  const sid = getSession();
  const acc = getAccounts().filter(a => a.id === sid)[0];
  if (acc) enterApp(acc);
  else showAuth();
})();
})();
</script>
