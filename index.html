<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>合租生活管家 · 可交互 Demo</title>
<meta name="description" content="合租生活管家：费用AA分摊、清洁值日排班、公共物品登记、室友公约，一个能在浏览器里直接操作的最小可用原型。">
<style>
:root{
  --bg:#F1F4F2;
  --surface:#FFFFFF;
  --surface-2:#F8FAF9;
  --ink:#14211D;
  --ink-2:#3E5049;
  --ink-3:#77887F;
  --line:#E2E8E4;
  --line-2:#EEF2EF;
  --primary:#1E7A63;
  --primary-2:#2A9C80;
  --primary-soft:#E6F3EF;
  --accent:#C9761F;
  --accent-soft:#FBF0E1;
  --blue:#2B6CB0;
  --blue-soft:#E9F1F9;
  --red:#B84C43;
  --red-soft:#FAEBE9;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(20,33,29,.05), 0 10px 26px -16px rgba(20,33,29,.22);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

.app{max-width:760px;margin:0 auto;background:var(--bg);min-height:100dvh;display:flex;flex-direction:column}

/* ---------- top ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 18px 10px}
.top-r{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{font-size:15px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--primary);display:block}
.badge{font-size:10.5px;font-weight:700;background:var(--primary-soft);color:#13604E;border-radius:99px;padding:2px 8px;letter-spacing:.03em}
.top-hint{font-size:11.5px;color:var(--ink-3);margin:7px 0 0}
.who{display:flex;align-items:center;gap:8px;margin-top:9px}
.who label{font-size:12px;color:var(--ink-3);white-space:nowrap}
.who select{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:13.5px;font-weight:600}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:0;z-index:20;display:flex;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:11px 14px;background:none;border:none;border-bottom:2px solid transparent;font-size:13.5px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}
.tab .cnt{display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;border-radius:99px;background:var(--accent);color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:700}

/* ---------- view ---------- */
.view{flex:1;padding:16px 18px 40px}
.sec{margin-bottom:20px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 9px}
.sec-h h2{margin:0;font-size:14px;font-weight:800;letter-spacing:.01em}
.sec-h span{font-size:12px;color:var(--ink-3)}

/* ---------- card ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow);margin-bottom:10px}
.card.tint{background:var(--primary-soft);border-color:#CFE6DF}
.card.warn{background:var(--accent-soft);border-color:#F0DCBC}
.card.alert{background:var(--red-soft);border-color:#F0CFCB}
.card.tap{cursor:pointer}
.card.tap:hover{border-color:#C9E2DA}
.cr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cr h3{margin:0;font-size:14.5px;font-weight:700;line-height:1.4}
.cr p{margin:3px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.5}
.cr .amt{font-size:15px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.big{font-size:26px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sub{font-size:12.5px;color:var(--ink-3);margin:4px 0 0}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;line-height:1.6;background:#EDF1EF;color:var(--ink-3)}
.pill.g{background:#D6EDE5;color:#13604E}
.pill.o{background:#F7E4C9;color:#8A4E0E}
.pill.r{background:#F7DEDA;color:#8E372F}
.pill.b{background:#DCE8F5;color:#1F4F80}

.rowlist{display:flex;flex-direction:column}
.rowitem{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line-2);font-size:13.5px}
.rowitem:last-child{border-bottom:none}
.rowitem .nm{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
.rowitem .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.av{width:22px;height:22px;border-radius:50%;background:var(--primary-soft);color:#13604E;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}

.bar{height:7px;border-radius:5px;background:#EDF1EF;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:5px}
.bar i.o{background:var(--accent)}
.bar i.r{background:var(--red)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;border:1px solid transparent;background:var(--primary);color:#fff;font-size:13.5px;font-weight:700;transition:.15s}
.btn:hover{background:#1A6B57}
.btn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);border-color:#CDD8D3}
.btn.danger{background:var(--surface);color:var(--red);border-color:#F0CFCB}
.btn.danger:hover{background:var(--red-soft)}
.btn.wide{width:100%}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;margin-top:11px}
.btnrow > .btn{flex:1}

/* ---------- form ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--ink-3);font-weight:700;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:14px}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.f2{grid-template-columns:1fr}}

/* ---------- preview ---------- */
.preview{background:var(--surface-2);border:1px dashed #CFE0D9;border-radius:var(--radius-sm);padding:12px 13px;margin:4px 0 12px}
.preview .ph{font-size:11.5px;font-weight:800;color:var(--primary);letter-spacing:.04em;margin-bottom:7px}

/* ---------- checklist ---------- */
.chk{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:13.5px;color:var(--ink-2)}
.chk input{margin:3px 0 0;width:15px;height:15px;accent-color:var(--primary);flex:0 0 auto}
.chk.done span{text-decoration:line-through;color:var(--ink-3)}

/* ---------- link ---------- */
.doclink{display:block;text-align:center;font-size:12.5px;color:var(--ink-3);padding:14px 18px 26px;text-decoration:none}
.doclink:hover{color:var(--primary)}
a{color:var(--primary)}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(20,33,29,.42);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--surface);width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:20px 20px 26px;max-height:90dvh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .sh-sub{margin:0 0 16px;font-size:12.5px;color:var(--ink-3)}
@media (min-width:600px){.mask{align-items:center;padding:24px}.sheet{border-radius:18px;max-height:82dvh}}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:99px;z-index:90;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);max-width:82vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- misc ---------- */
.empty{text-align:center;padding:34px 16px;color:var(--ink-3);font-size:13.5px}
.empty b{display:block;color:var(--ink-2);font-size:14.5px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .card{margin-bottom:0}
.kvmini{font-size:12.5px;color:var(--ink-3);margin-top:8px;display:flex;flex-wrap:wrap;gap:10px}
.divide{height:1px;background:var(--line-2);margin:12px 0}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-r">
      <div class="brand"><i></i>合租生活管家<span class="badge">Demo</span></div>
      <button class="btn ghost sm" id="btnReset" type="button">重置数据</button>
    </div>
    <div class="who">
      <label for="whoami">当前身份</label>
      <select id="whoami"></select>
    </div>
    <p class="top-hint">切换身份，可以模拟不同室友的操作（确认账单、打卡、认领采购）</p>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main class="view" id="view"></main>

  <a class="doclink" href="design.html">查看完整产品设计方案 →</a>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ============================================================
   工具
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => '¥' + (Math.round((Number(n) || 0) * 100) / 100).toFixed(2);
const uid = p => (p || 'x') + Math.random().toString(36).slice(2, 8);
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dcn = ds => { const p = String(ds || '').split('-'); return p.length === 3 ? Number(p[1]) + '月' + Number(p[2]) + '日' : '待定'; };
const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const nowHM = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

/* ============================================================
   数据层
   ============================================================ */
const KEY = 'roomies_demo_v1';
const AREAS = [
  { name: '卫生间', list: ['地漏滤网', '台面水渍', '马桶', '垃圾清运'] },
  { name: '厨房', list: ['灶台油污', '水槽滤网', '台面', '垃圾桶'] },
  { name: '客厅与地面', list: ['地面清扫', '茶几整理', '沙发缝隙'] },
  { name: '垃圾清运', list: ['厨余垃圾', '可回收物', '更换垃圾袋'] }
];

let S = null;

function seed() {
  const now = new Date();
  const ds = ymd(now);
  const members = [
    { id: 'm1', name: '小林', room: '主卧', weight: 1.2 },
    { id: 'm2', name: '小周', room: '次卧', weight: 1.0 },
    { id: 'm3', name: '小陈', room: '小卧', weight: 0.8 }
  ];
  const ids = members.map(m => m.id);
  const even = splitEven(286.40, ids, 'm1');
  const even2 = splitEven(120.00, ids, 'm2');
  return {
    house: { name: '安心小屋' },
    pactVersion: 'v1.2',
    me: 'm3',
    members: members,
    bills: [
      {
        id: 'b1', title: '电费 2026-09', category: '水电', amount: 286.40, payerId: 'm1', rule: 'even',
        shares: even, confirm: { m1: 'ok', m2: 'ok', m3: 'pending' },
        status: 'confirming', date: ds, version: 1, note: '抄表 1842 → 2214 kWh'
      },
      {
        id: 'b2', title: '宽带 2026-09', category: '网费', amount: 120.00, payerId: 'm2', rule: 'even',
        shares: even2, confirm: { m1: 'ok', m2: 'ok', m3: 'ok' },
        status: 'settled', date: ds, version: 1, note: '9 月 12 日已结清'
      }
    ],
    transfers: [],
    tasks: [],
    swaps: [],
    items: [
      { id: 'i1', name: '抽纸', category: '消耗品', stock: 0, safety: 2, unit: '包', days: 0, purchaserId: 'm2' },
      { id: 'i2', name: '垃圾袋', category: '消耗品', stock: 36, safety: 10, unit: '只', days: 24, purchaserId: 'm3' },
      { id: 'i3', name: '洗洁精', category: '消耗品', stock: 1, safety: 2, unit: '瓶', days: 5, purchaserId: 'm1' },
      { id: 'i4', name: '吸尘器', category: '共享设备', stock: 1, safety: 1, unit: '台', days: 0, purchaserId: null,
        borrow: { by: 'm3', due: '今晚 20:00' } }
    ],
    restocks: [],
    pacts: [
      { id: 'p1', text: '房租、水电、燃气按人头均摊', category: '费用与分摊', binding: 'M1 · 账单默认分摊方式', enforceable: true },
      { id: 'p2', text: '垃圾每日 22:00 前清运', category: '卫生与清洁', binding: 'M2 · 自动生成日频任务', enforceable: true },
      { id: 'p3', text: '公共消耗品保持 1 件安全库存', category: '公共物品', binding: 'M3 · 补货提醒阈值', enforceable: true },
      { id: 'p4', text: '安静时段 23:00–08:00，不弹横幅', category: '作息与噪音', binding: 'M5 · 该时段仅站内通知', enforceable: true },
      { id: 'p5', text: '马桶圈用完放下', category: '卫生与清洁', binding: '仅靠自觉，系统无法约束', enforceable: false }
    ],
    votes: [
      { id: 'v1', text: '夏天空调统一设定为 26℃', support: ['m1', 'm2'], against: [], deadline: '2 天后截止', threshold: 2, closed: false }
    ]
  };
}

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 忽略隐私模式写入失败 */ } }

function load() {
  let ok = false;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const o = JSON.parse(raw); if (o && o.members && o.bills) { S = o; ok = true; } }
  } catch (e) { ok = false; }
  if (!ok) { S = seed(); save(); }
  if (!S.transfers) S.transfers = [];
  if (!S.swaps) S.swaps = [];
  if (!S.tasks) S.tasks = [];
}

/* ============================================================
   计算
   ============================================================ */
const member = id => S.members.find(m => m.id === id) || { name: '?', id: id };
const mName = id => member(id).name;
const mInit = id => mName(id).slice(-1);

/* 均摊：尾差补给垫付人，保证分项之和严格等于总额 */
function splitEven(amount, ids, payerId) {
  const total = Math.round(Number(amount) * 100);
  const n = ids.length;
  const base = Math.floor(total / n);
  const cents = {}; ids.forEach(id => cents[id] = base);
  const rest = total - base * n;
  const holder = (payerId && ids.indexOf(payerId) >= 0) ? payerId : ids[0];
  cents[holder] += rest;
  const out = {}; ids.forEach(id => out[id] = cents[id] / 100);
  return out;
}

/* 按房间权重：非整分部分由最后一位吸收 */
function splitWeight(amount, ids, payerId) {
  const total = Math.round(Number(amount) * 100);
  const wsum = ids.reduce((s, id) => s + (member(id).weight || 1), 0);
  let used = 0; const cents = {};
  ids.forEach((id, i) => {
    if (i === ids.length - 1) { cents[id] = total - used; return; }
    const v = Math.round(total * (member(id).weight || 1) / wsum);
    cents[id] = v; used += v;
  });
  const out = {}; ids.forEach(id => out[id] = cents[id] / 100);
  return out;
}

function computeShares(amount, rule, payerId) {
  const ids = S.members.map(m => m.id);
  return rule === 'weight' ? splitWeight(amount, ids, payerId) : splitEven(amount, ids, payerId);
}

function billStatusOf(confirm) {
  const vals = Object.values(confirm);
  if (vals.indexOf('dispute') >= 0) return 'disputed';
  if (vals.every(v => v === 'ok')) return 'unpaid';
  return 'confirming';
}

/* 净额：正数=别人欠我（应收），负数=我欠别人（应付） */
function computeNet() {
  const net = {}; S.members.forEach(m => net[m.id] = 0);
  S.bills.filter(b => b.status === 'unpaid').forEach(b => {
    net[b.payerId] = (net[b.payerId] || 0) + (b.amount - (b.shares[b.payerId] || 0));
    S.members.forEach(m => { if (m.id !== b.payerId) net[m.id] = (net[m.id] || 0) - (b.shares[m.id] || 0); });
  });
  S.transfers.forEach(t => {
    if (t.receivedAt) return;
    net[t.from] = (net[t.from] || 0) + t.amount;
    net[t.to] = (net[t.to] || 0) - t.amount;
  });
  Object.keys(net).forEach(k => net[k] = Math.round(net[k] * 100) / 100);
  return net;
}

/* 最少转账方案：贪心抵消，n 人最多 n-1 笔 */
function planTransfers(net) {
  const recv = [], pay = [];
  Object.keys(net).forEach(id => {
    if (net[id] > 0.005) recv.push({ id: id, v: net[id] });
    else if (net[id] < -0.005) pay.push({ id: id, v: -net[id] });
  });
  recv.sort((a, b) => b.v - a.v); pay.sort((a, b) => b.v - a.v);
  const out = []; let i = 0, j = 0;
  while (i < recv.length && j < pay.length) {
    const amt = Math.min(recv[i].v, pay[j].v);
    out.push({ from: pay[j].id, to: recv[i].id, amount: Math.round(amt * 100) / 100 });
    recv[i].v -= amt; pay[j].v -= amt;
    if (recv[i].v < 0.005) i++;
    if (pay[j].v < 0.005) j++;
  }
  return out;
}

/* 全部债务清零后，把待支付账单标记为已结清 */
function reconcile() {
  const net = computeNet();
  const dirty = Object.keys(net).some(k => Math.abs(net[k]) > 0.005);
  const pendingRecv = S.transfers.some(t => !t.receivedAt && t.paidAt);
  if (!dirty && !pendingRecv) {
    S.bills.forEach(b => { if (b.status === 'unpaid') b.status = 'settled'; });
  }
}

/* ============================================================
   本周值日
   ============================================================ */
function startOfWeek(d) { const x = new Date(d); const off = (x.getDay() + 6) % 7; x.setDate(x.getDate() - off); x.setHours(0, 0, 0, 0); return x; }

function ensureTasks() {
  const mon = startOfWeek(new Date());
  const week = []; for (let i = 0; i < 7; i++) { const d = new Date(mon); d.setDate(mon.getDate() + i); week.push(ymd(d)); }
  const today = ymd(new Date());
  const exist = {}; S.tasks.forEach(t => { if (week.indexOf(t.date) >= 0) exist[t.date] = true; });
  week.forEach((ds, i) => {
    if (exist[ds]) return;
    const area = AREAS[i % AREAS.length];
    const who = S.members[i % S.members.length];
    S.tasks.push({
      id: uid('t'), area: area.name, date: ds, assigneeId: who.id,
      status: ds < today ? 'done' : 'pending',
      checklist: area.list.map(x => ({ t: x, done: ds < today })),
      proofAt: ds < today ? '21:30' : null,
      swapTo: null, swapStatus: null
    });
  });
  S.tasks.sort((a, b) => a.date < b.date ? -1 : 1);
}

/* ============================================================
   渲染
   ============================================================ */
let TAB = 'home';
let BILLTAB = 'list';

const STATUS_TXT = { confirming: '待确认', unpaid: '待支付', settled: '已结清', disputed: '协商中' };
const STATUS_CLS = { confirming: 'o', unpaid: 'b', settled: 'g', disputed: 'r' };

function render() {
  renderWho();
  renderTabs();
  const v = $('#view');
  if (TAB === 'home') v.innerHTML = viewHome();
  else if (TAB === 'bills') v.innerHTML = BILLTAB === 'settle' ? viewSettle() : viewBills();
  else if (TAB === 'shift') v.innerHTML = viewShift();
  else if (TAB === 'items') v.innerHTML = viewItems();
  else v.innerHTML = viewPact();
  const m = $('#modalRoot');
  if (m.dataset.for && m.dataset.for !== TAB) { m.innerHTML = ''; m.removeAttribute('data-for'); }
}

function renderWho() {
  $('#whoami').innerHTML = S.members.map(m =>
    `<option value="${m.id}"${m.id === S.me ? ' selected' : ''}>${esc(m.name)} · ${esc(m.room)}${m.id === 'm1' ? '（房屋创建者）' : ''}</option>`
  ).join('');
}

function todoCount() {
  const me = S.me;
  let n = 0;
  n += S.bills.filter(b => b.status === 'confirming' && b.confirm[me] === 'pending').length;
  n += S.tasks.filter(t => t.date === ymd(new Date()) && t.assigneeId === me && t.status === 'pending').length;
  n += S.items.filter(i => i.category === '消耗品' && i.stock <= i.safety).length ? 0 : 0;
  n += S.transfers.filter(t => t.to === me && !t.receivedAt).length;
  return n;
}

function renderTabs() {
  const pend = S.bills.filter(b => b.status === 'confirming' && b.confirm[S.me] === 'pending').length;
  const t = [
    { k: 'home', n: '首页' },
    { k: 'bills', n: '账单', c: pend },
    { k: 'shift', n: '值日' },
    { k: 'items', n: '物品' },
    { k: 'pact', n: '公约' }
  ];
  $('#tabs').innerHTML = t.map(x =>
    `<button class="tab${TAB === x.k ? ' on' : ''}" data-act="tab" data-id="${x.k}" type="button">${x.n}${x.c ? `<span class="cnt">${x.c}</span>` : ''}</button>`
  ).join('');
}

/* ---------- 首页 ---------- */
function viewHome() {
  const me = S.me;
  const today = ymd(new Date());
  const net = computeNet();
  const myNet = net[me] || 0;
  const todoBills = S.bills.filter(b => b.status === 'confirming' && b.confirm[me] === 'pending');
  const todayTasks = S.tasks.filter(t => t.date === today && t.assigneeId === me && t.status === 'pending');
  const todayOthers = S.tasks.filter(t => t.date === today && t.assigneeId !== me);
  const waitOthers = S.bills.filter(b => b.status === 'confirming' && b.confirm[me] === 'ok');
  const needBuy = S.items.filter(i => i.category === '消耗品' && i.stock <= i.safety);
  const toRecv = S.transfers.filter(t => t.to === me && !t.receivedAt);
  const mySwap = S.swaps.filter(s => s.to === me && s.status === 'pending');
  const total = todoBills.length + todayTasks.length + toRecv.length + mySwap.length;
  const monthBills = S.bills.filter(b => b.date.slice(0, 7) === today.slice(0, 7));
  const perHead = monthBills.reduce((s, b) => s + b.amount, 0) / S.members.length;

  let h = '';
  h += `<div class="sec">
    <div class="sec-h"><h2>待我处理</h2><span>${total ? total + ' 项' : '暂无待办'}</span></div>`;

  if (!total) {
    h += `<div class="card"><div class="cr"><div><h3>全部处理完了 👍</h3><p>当前没有需要你确认的事项</p></div></div></div>`;
  }
  todoBills.forEach(b => {
    h += card({
      cls: 'warn', act: 'bill', id: b.id,
      title: b.title + ' 待确认',
      sub: `${esc(mName(b.payerId))}垫付 ${fmt(b.amount)} · ${b.rule === 'even' ? '均摊' : '按权重'}`,
      pill: fmt(b.shares[me] || 0), pillCls: 'o'
    });
  });
  todayTasks.forEach(t => {
    h += `<div class="card tint">
      <div class="cr"><div><h3>今日值日 · ${esc(t.area)}</h3><p>检查清单 ${t.checklist.length} 项 · 22:00 前完成</p></div><span class="pill g">今天</span></div>
      <div class="btnrow">
        <button class="btn sm" data-act="checkin" data-id="${t.id}" type="button">拍照打卡</button>
        <button class="btn ghost sm" data-act="swap" data-id="${t.id}" type="button">申请换班</button>
      </div></div>`;
  });
  todayOthers.forEach(t => {
    h += `<div class="card">
      <div class="cr"><div><h3>今日值日 · ${esc(t.area)}</h3>
        <p>今天由 ${esc(mName(t.assigneeId))} 负责 · ${t.status === 'done' ? '已完成' : '22:00 前完成'}</p></div>
        ${t.status === 'done' ? '<span class="pill g">已完成</span>' : '<span class="pill">进行中</span>'}</div></div>`;
  });
  toRecv.forEach(t => {
    h += `<div class="card">
      <div class="cr"><div><h3>${esc(mName(t.from))} 已向你转账</h3><p>对方标记于 ${esc(t.paidAt)} · 确认后该笔债务关闭</p></div><span class="amt">${fmt(t.amount)}</span></div>
      <div class="btnrow"><button class="btn sm" data-act="recv" data-id="${t.id}" type="button">确认已收到</button></div></div>`;
  });
  mySwap.forEach(s => {
    const tk = S.tasks.find(x => x.id === s.taskId) || { area: '值日', date: '' };
    h += `<div class="card">
      <div class="cr"><div><h3>${esc(mName(s.from))} 申请与你换班</h3><p>${esc(dcn(tk.date))} ${esc(tk.area)} · 原因：${esc(s.reason || '未填写')}</p></div><span class="pill o">待响应</span></div>
      <div class="btnrow">
        <button class="btn sm" data-act="swapOk" data-id="${s.id}" type="button">同意</button>
        <button class="btn ghost sm" data-act="swapNo" data-id="${s.id}" type="button">拒绝</button>
      </div></div>`;
  });
  waitOthers.forEach(b => {
    const left = S.members.filter(m => b.confirm[m.id] === 'pending').map(m => m.name).join('、');
    h += `<div class="card">
      <div class="cr"><div><h3>${esc(b.title)}</h3>
        <p>你已确认 · 等待 ${esc(left || '—')} 确认</p></div><span class="pill">等待中</span></div></div>`;
  });
  h += `</div>`;

  h += `<div class="sec">
    <div class="sec-h"><h2>我的账</h2><span>${esc(S.house.name)}</span></div>
    <div class="card">
      <p class="sub" style="margin:0">我的净额</p>
      <div class="big" style="color:${myNet > 0.005 ? 'var(--primary)' : (myNet < -0.005 ? 'var(--red)' : 'var(--ink)')}">
        ${myNet > 0.005 ? '+' + fmt(myNet) : (myNet < -0.005 ? '-' + fmt(Math.abs(myNet)) : fmt(0))}
      </div>
      <p class="sub">${myNet > 0.005 ? '应收：别人欠你' : (myNet < -0.005 ? '应付：你欠别人' : '已全部结清')} · 本月人均支出 ${fmt(perHead)}</p>
      <div class="btnrow">
        <button class="btn sm" data-act="settle" type="button">前往结算中心</button>
        <button class="btn ghost sm" data-act="newbill" type="button">新建账单</button>
      </div>
    </div>
  </div>`;

  h += `<div class="sec">
    <div class="sec-h"><h2>房屋动态</h2><span>${S.members.length} 位成员</span></div>
    <div class="card"><div class="rowlist">`;
  const feed = [];
  S.tasks.filter(t => t.status === 'done').slice(-2).forEach(t => feed.push(`${mName(t.assigneeId)} 完成「${t.area}」值日 · ${dcn(t.date)}`));
  needBuy.forEach(i => feed.push(`${i.name} 已低于安全库存，采购负责人：${mName(i.purchaserId)}`));
  S.bills.forEach(b => { if (b.status === 'settled') feed.push(`${b.title} 已结清 · ${fmt(b.amount)}`); });
  if (!feed.length) feed.push('暂无动态');
  h += feed.slice(-4).map(f => `<div class="rowitem"><span class="nm"><span class="av">·</span>${esc(f)}</span></div>`).join('');
  h += `</div></div></div>`;

  return h;
}

function card(o) {
  return `<div class="card ${o.cls || ''} ${o.act ? 'tap' : ''}" ${o.act ? `data-act="${o.act}" data-id="${o.id}"` : ''}>
    <div class="cr">
      <div><h3>${esc(o.title)}</h3>${o.sub ? `<p>${o.sub}</p>` : ''}</div>
      ${o.pill ? `<span class="amt ${o.pillCls === 'o' ? '' : ''}" style="${o.pillCls === 'o' ? 'color:var(--accent)' : ''}">${esc(o.pill)}</span>` : ''}
    </div></div>`;
}

/* ---------- 账单 ---------- */
function viewBills() {
  const me = S.me;
  let h = `<div class="sec">
    <div class="sec-h"><h2>账单</h2>
      <span><button class="btn ghost sm" data-act="settle" type="button">结算中心</button></span>
    </div>`;

  const groups = [
    { k: 'confirming', n: '待确认' }, { k: 'disputed', n: '协商中' },
    { k: 'unpaid', n: '待支付' }, { k: 'settled', n: '已结清' }
  ];
  let any = false;
  groups.forEach(g => {
    const list = S.bills.filter(b => b.status === g.k);
    if (!list.length) return;
    any = true;
    h += `<p class="sub" style="margin:16px 0 8px;font-weight:800;color:var(--ink-2)">${g.n} · ${list.length}</p>`;
    list.forEach(b => {
      const mine = b.shares[me] || 0;
      const myState = b.confirm[me];
      const tag = b.status === 'confirming'
        ? (myState === 'pending' ? '<span class="pill o">待你确认</span>' : (myState === 'ok' ? '<span class="pill g">你已确认</span>' : '<span class="pill r">你已提出异议</span>'))
        : `<span class="pill ${STATUS_CLS[b.status]}">${STATUS_TXT[b.status]}</span>`;
      h += `<div class="card tap" data-act="bill" data-id="${b.id}">
        <div class="cr">
          <div><h3>${esc(b.title)}</h3>
            <p>${esc(mName(b.payerId))}垫付 ${fmt(b.amount)} · ${b.rule === 'even' ? '按人头均摊' : '按房间权重'}${b.version > 1 ? ' · v' + b.version : ''}</p>
          </div>
          <span class="amt">${fmt(mine)}</span>
        </div>
        <div class="kvmini">${tag}<span class="muted">我应付 ${fmt(mine)}</span></div>
      </div>`;
    });
  });
  if (!any) h += `<div class="empty"><b>还没有账单</b>点下面的按钮记下第一笔</div>`;
  h += `</div><button class="btn wide" data-act="newbill" type="button">＋ 新建账单</button>`;
  return h;
}

function viewSettle() {
  const me = S.me;
  const net = computeNet();
  const plan = planTransfers(net);
  const recv = S.transfers.filter(t => t.to === me && !t.receivedAt);
  const waitFor = S.transfers.filter(t => t.from === me && !t.receivedAt);

  let h = `<div class="sec">
    <div class="sec-h"><h2>结算中心</h2><span><button class="btn ghost sm" data-act="bills" type="button">返回账单</button></span></div>
    <div class="card tint">
      <p class="sub" style="margin:0">我的净额</p>
      <div class="big">${net[me] > 0.005 ? '+' + fmt(net[me]) : (net[me] < -0.005 ? '-' + fmt(Math.abs(net[me])) : fmt(0))}</div>
      <p class="sub">逐笔债务已压缩为 ${plan.length} 笔转账（净额结算）</p>
    </div>

    <p class="sub" style="margin:16px 0 8px;font-weight:800;color:var(--ink-2)">最少转账方案 · ${plan.length} 笔</p>`;

  if (!plan.length) h += `<div class="card"><div class="cr"><div><h3>当前没有待结清的债务</h3><p>所有账单均已结清</p></div></div></div>`;
  plan.forEach(p => {
    const mine = (p.from === me) ? 'from' : ((p.to === me) ? 'to' : '');
    h += `<div class="card">
      <div class="cr">
        <div><h3>${esc(mName(p.from))} → ${esc(mName(p.to))}</h3>
        <p>${mine === 'from' ? '你需要转出' : (mine === 'to' ? '你将收到' : '与你无关的一笔')}</p></div>
        <span class="amt">${fmt(p.amount)}</span>
      </div>
      ${mine === 'from' ? `<div class="btnrow"><button class="btn sm" data-act="paid" data-from="${p.from}" data-to="${p.to}" data-amt="${p.amount}" type="button">我已转账</button></div>` : ''}
      ${mine === 'to' ? `<div class="btnrow"><button class="btn ghost sm" data-act="fakePaid" data-from="${p.from}" data-to="${p.to}" data-amt="${p.amount}" type="button">模拟对方已转账</button></div>` : ''}
    </div>`;
  });

  if (recv.length) {
    h += `<p class="sub" style="margin:16px 0 8px;font-weight:800;color:var(--ink-2)">待我确认收款 · ${recv.length}</p>`;
    recv.forEach(t => {
      h += `<div class="card"><div class="cr">
        <div><h3>${esc(mName(t.from))} 已转账给你</h3><p>标记时间 ${esc(t.paidAt)}</p></div>
        <span class="amt">${fmt(t.amount)}</span></div>
        <div class="btnrow"><button class="btn sm" data-act="recv" data-id="${t.id}" type="button">确认已收到</button></div>
      </div>`;
    });
  }
  if (waitFor.length) {
    h += `<p class="sub" style="margin:16px 0 8px;font-weight:800;color:var(--ink-2)">我已转账，等待对方确认 · ${waitFor.length}</p>`;
    waitFor.forEach(t => {
      h += `<div class="card"><div class="cr">
        <div><h3>已转给 ${esc(mName(t.to))}</h3><p>等待对方确认收款</p></div>
        <span class="amt">${fmt(t.amount)}</span></div></div>`;
    });
  }
  h += `</div>`;
  return h;
}

/* ---------- 值日 ---------- */
function viewShift() {
  const me = S.me;
  const today = ymd(new Date());
  const mon = startOfWeek(new Date());
  const week = []; for (let i = 0; i < 7; i++) { const d = new Date(mon); d.setDate(mon.getDate() + i); week.push(ymd(d)); }
  const mine = S.tasks.filter(t => week.indexOf(t.date) >= 0 && t.assigneeId === me);
  const doneN = S.tasks.filter(t => week.indexOf(t.date) >= 0).filter(t => t.status === 'done').length;

  let h = `<div class="sec">
    <div class="sec-h"><h2>本周值日表</h2><span>共 ${S.tasks.filter(t => week.indexOf(t.date) >= 0).length} 项 · 已完成 ${doneN} 项</span></div>`;

  week.forEach(ds => {
    const t = S.tasks.find(x => x.date === ds);
    if (!t) return;
    const isToday = ds === today;
    const isMe = t.assigneeId === me;
    const st = t.status === 'done' ? '<span class="pill g">已完成</span>'
      : (isToday ? '<span class="pill o">今天 22:00 前</span>' : '<span class="pill">待办</span>');
    h += `<div class="card ${isToday && isMe ? 'tint' : ''}">
      <div class="cr">
        <div><h3>${esc(dcn(ds))} ${esc(WD[new Date(ds.replace(/-/g, '/')).getDay()])} · ${esc(t.area)}</h3>
          <p>负责人：${esc(mName(t.assigneeId))}${t.proofAt ? ' · ' + esc(t.proofAt) + ' 打卡' : ''}${isMe ? ' · 是你' : ''}</p></div>
        ${st}
      </div>`;
    if (isToday && isMe && t.status === 'pending') {
      h += `<div class="btnrow">
        <button class="btn sm" data-act="checkin" data-id="${t.id}" type="button">拍照打卡</button>
        <button class="btn ghost sm" data-act="swap" data-id="${t.id}" type="button">申请换班</button>
      </div>`;
    }
    h += `</div>`;
  });
  h += `</div>`;

  const swapIn = S.swaps.filter(s => s.to === me && s.status === 'pending');
  if (swapIn.length) {
    h += `<div class="sec"><div class="sec-h"><h2>待我响应的换班</h2></div>`;
    swapIn.forEach(s => {
      const tk = S.tasks.find(x => x.id === s.taskId) || { area: '', date: '' };
      h += `<div class="card"><div class="cr">
        <div><h3>${esc(mName(s.from))} 申请换班</h3><p>${esc(dcn(tk.date))} ${esc(tk.area)} · ${esc(s.reason || '未填写原因')}</p></div>
        <span class="pill o">待响应</span></div>
        <div class="btnrow">
          <button class="btn sm" data-act="swapOk" data-id="${s.id}" type="button">同意</button>
          <button class="btn ghost sm" data-act="swapNo" data-id="${s.id}" type="button">拒绝</button>
        </div></div>`;
    });
    h += `</div>`;
  }

  h += `<div class="sec"><div class="sec-h"><h2>本周我的任务</h2><span>${mine.length} 项</span></div>`;
  if (!mine.length) h += `<div class="card"><div class="cr"><div><h3>本周没有你的任务</h3><p>按轮值规则，下周会轮到你</p></div></div></div>`;
  mine.forEach(t => {
    h += `<div class="card"><div class="cr">
      <div><h3>${esc(dcn(t.date))} · ${esc(t.area)}</h3><p>${t.checklist.map(c => esc(c.t)).join(' / ')}</p></div>
      ${t.status === 'done' ? '<span class="pill g">已完成</span>' : '<span class="pill o">待办</span>'}</div></div>`;
  });
  h += `</div>`;
  return h;
}

/* ---------- 物品 ---------- */
function viewItems() {
  const me = S.me;
  const cats = ['消耗品', '共享设备'];
  let h = `<div class="sec">
    <div class="sec-h"><h2>公共物品</h2><span>${S.items.length} 项在册</span></div>`;

  cats.forEach(c => {
    const list = S.items.filter(i => i.category === c);
    if (!list.length) return;
    h += `<p class="sub" style="margin:14px 0 8px;font-weight:800;color:var(--ink-2)">${c}</p>`;
    list.forEach(i => {
      const need = i.stock <= i.safety;
      const low = !need && i.stock <= i.safety * 1.6;
      const pct = Math.max(0, Math.min(100, Math.round(i.stock / (i.safety * 4) * 100)));
      const badge = need ? '<span class="pill r">需采购</span>' : (low ? '<span class="pill o">偏低</span>' : '<span class="pill g">充足</span>');
      h += `<div class="card ${need ? 'warn' : ''}">
        <div class="cr">
          <div><h3>${esc(i.name)}</h3>
            <p>剩余 ${i.stock} ${esc(i.unit)} · 安全库存 ${i.safety} ${esc(i.unit)}${i.purchaserId ? ' · 采购负责人 ' + esc(mName(i.purchaserId)) : ''}</p>
          </div>${badge}
        </div>
        <div class="bar"><i class="${need ? 'r' : (low ? 'o' : '')}" style="width:${pct}%"></i></div>`;
      if (i.borrow) {
        h += `<p class="sub">${esc(mName(i.borrow.by))} 借用中 · 预计 ${esc(i.borrow.due)} 归还</p>`;
      }
      if (i.category === '消耗品') {
        h += `<div class="btnrow">
          <button class="btn ghost sm" data-act="empty" data-id="${i.id}" type="button">快没了</button>
          ${need ? `<button class="btn sm" data-act="buy" data-id="${i.id}" type="button">我去买</button>` : ''}
        </div>`;
      }
      h += `</div>`;
    });
  });
  h += `</div>`;
  return h;
}

/* ---------- 公约 ---------- */
function viewPact() {
  const me = S.me;
  const cats = [];
  S.pacts.forEach(p => { if (cats.indexOf(p.category) < 0) cats.push(p.category); });

  let h = `<div class="sec">
    <div class="sec-h"><h2>室友公约</h2><span>当前生效 ${esc(S.pactVersion)}</span></div>
    <div class="card tint">
      <div class="cr"><div><h3>公约 ${esc(S.pactVersion)}</h3><p>全体成员已签署（${S.members.length}/${S.members.length}）</p></div><span class="pill g">生效中</span></div>
      <p class="sub">可执行的条款已绑定到系统规则，不需要每次重新商量</p>
    </div>`;

  cats.forEach(c => {
    h += `<p class="sub" style="margin:14px 0 8px;font-weight:800;color:var(--ink-2)">${esc(c)}</p>`;
    S.pacts.filter(p => p.category === c).forEach(p => {
      h += `<div class="card">
        <div class="cr"><div><h3>${esc(p.text)}</h3><p>${esc(p.binding)}</p></div>
        ${p.enforceable ? '<span class="pill g">已绑定</span>' : '<span class="pill">仅靠自觉</span>'}</div>
      </div>`;
    });
  });
  h += `</div>`;

  h += `<div class="sec"><div class="sec-h"><h2>提案与投票</h2></div>`;
  S.votes.forEach(v => {
    const ok = v.support.indexOf(me) >= 0, no = v.against.indexOf(me) >= 0;
    const pass = v.support.length >= v.threshold;
    h += `<div class="card">
      <div class="cr"><div><h3>${esc(v.text)}</h3><p>${esc(v.deadline)} · 通过阈值 ${v.threshold} 票</p></div>
      <span class="pill ${pass ? 'g' : 'o'}">${v.support.length} 支持 / ${v.against.length} 反对</span></div>
      <div class="btnrow">
        <button class="btn ${ok ? '' : 'ghost'} sm" data-act="vote" data-id="${v.id}" data-v="1" type="button">${ok ? '已支持' : '支持'}</button>
        <button class="btn ${no ? 'danger' : 'ghost'} sm" data-act="vote" data-id="${v.id}" data-v="0" type="button">${no ? '已反对' : '反对'}</button>
      </div>
      ${pass ? '<p class="sub">已达到通过阈值，将在截止后自动生效</p>' : ''}
    </div>`;
  });
  h += `</div>`;

  h += `<div class="sec"><div class="sec-h"><h2>版本历史</h2></div>
    <div class="card"><div class="rowlist">
      <div class="rowitem"><span class="nm"><span class="av">1.2</span>公共消耗品安全库存条款（小周 修改）</span><span class="muted">9 月 18 日</span></div>
      <div class="rowitem"><span class="nm"><span class="av">1.1</span>新增安静时段 23:00–08:00（小林 修改）</span><span class="muted">8 月 02 日</span></div>
      <div class="rowitem"><span class="nm"><span class="av">1.0</span>入住时全体签署</span><span class="muted">7 月 15 日</span></div>
    </div></div></div>`;
  return h;
}

/* ============================================================
   弹层
   ============================================================ */
function openSheet(html, forTab) {
  const r = $('#modalRoot');
  r.dataset.for = forTab || TAB;
  r.innerHTML = `<div class="mask"><div class="sheet">${html}</div></div>`;
}
function closeSheet() { const r = $('#modalRoot'); r.innerHTML = ''; r.removeAttribute('data-for'); }

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('on'), 2000);
}

/* ---------- 新建账单 ---------- */
function sheetNewBill() {
  const opts = S.members.map(m => `<option value="${m.id}"${m.id === S.me ? ' selected' : ''}>${esc(m.name)} · ${esc(m.room)}</option>`).join('');
  openSheet(`
    <h3>新建账单</h3>
    <p class="sh-sub">分摊方式默认取自公约 ${esc(S.pactVersion)} 第 3 条「房租水电按人头均摊」</p>
    <div class="field"><label for="nbTitle">账单名称</label><input id="nbTitle" value="水费 2026-09" maxlength="40"></div>
    <div class="f2">
      <div class="field"><label for="nbCat">类别</label>
        <select id="nbCat"><option>水电</option><option>燃气</option><option>网费</option><option>房租</option><option>日用品</option><option>维修</option><option>其他</option></select>
      </div>
      <div class="field"><label for="nbAmt">总额（元）</label><input id="nbAmt" type="number" step="0.01" min="0" value="186.50"></div>
    </div>
    <div class="f2">
      <div class="field"><label for="nbPayer">垫付人</label><select id="nbPayer">${opts}</select></div>
      <div class="field"><label for="nbRule">分摊方式</label>
        <select id="nbRule"><option value="even">按人头均摊</option><option value="weight">按房间权重</option></select>
      </div>
    </div>
    <div class="field"><label for="nbNote">备注（可选）</label><input id="nbNote" placeholder="例如：抄表 1842 → 2214 kWh" maxlength="60"></div>
    <div class="preview" id="nbPreview"></div>
    <div class="btnrow">
      <button class="btn ghost" data-act="close" type="button">取消</button>
      <button class="btn" data-act="createBill" type="button">提交并推送确认</button>
    </div>
  `, 'bills');

  const upd = () => {
    const amt = Number($('#nbAmt').value) || 0;
    const rule = $('#nbRule').value;
    const payer = $('#nbPayer').value;
    const sh = computeShares(amt, rule, payer);
    $('#nbPreview').innerHTML =
      `<div class="ph">实时预览 · 每人应付（合计 ${fmt(Object.values(sh).reduce((a, b) => a + b, 0))}）</div>` +
      S.members.map(m => `<div class="rowitem"><span class="nm">${esc(m.name)}${m.id === payer ? '（垫付人）' : ''}</span><span class="v">${fmt(sh[m.id])}</span></div>`).join('');
  };
  ['nbAmt', 'nbRule', 'nbPayer'].forEach(id => { $('#' + id).addEventListener('input', upd); $('#' + id).addEventListener('change', upd); });
  upd();
}

/* ---------- 账单详情 ---------- */
function sheetBill(id) {
  const b = S.bills.find(x => x.id === id);
  if (!b) return;
  const me = S.me;
  const rows = S.members.map(m => {
    const st = b.confirm[m.id];
    const txt = st === 'ok' ? '<span class="pill g">已确认</span>' : (st === 'dispute' ? '<span class="pill r">有异议</span>' : '<span class="pill o">待确认</span>');
    return `<div class="rowitem">
      <span class="nm"><span class="av">${esc(mInit(m.id))}</span>${esc(m.name)}${m.id === b.payerId ? '（垫付）' : ''}</span>
      <span class="v">${fmt(b.shares[m.id])}</span>${st && b.status === 'confirming' ? txt : ''}
    </div>`;
  }).join('');

  const mine = b.shares[me] || 0;
  let actions = '';
  if (b.status === 'confirming' && b.confirm[me] === 'pending') {
    actions = `<div class="btnrow">
      <button class="btn ghost" data-act="dispute" data-id="${b.id}" type="button">有异议</button>
      <button class="btn" data-act="ok" data-id="${b.id}" type="button">确认这笔账</button>
    </div>`;
  } else if (b.status === 'disputed') {
    actions = `<p class="sub">账目存在异议，可重新提交修订版本（Demo 中点击下方按钮模拟）</p>
      <div class="btnrow"><button class="btn ghost" data-act="revise" data-id="${b.id}" type="button">修订为按天折算 → 重新推送</button></div>`;
  } else if (b.status === 'unpaid') {
    actions = `<div class="btnrow"><button class="btn" data-act="settle" type="button">前往结算中心处理</button></div>`;
  }

  openSheet(`
    <h3>${esc(b.title)}</h3>
    <p class="sh-sub">${esc(STATUS_TXT[b.status])}${b.version > 1 ? ' · 版本 v' + b.version : ''} · ${b.rule === 'even' ? '按人头均摊' : '按房间权重'}${b.note ? ' · ' + esc(b.note) : ''}</p>
    <div class="card" style="text-align:center;box-shadow:none">
      <p class="sub" style="margin:0">账单总额</p>
      <div class="big">${fmt(b.amount)}</div>
      <p class="sub">垫付人：${esc(mName(b.payerId))}</p>
    </div>
    <p class="sub" style="font-weight:800;color:var(--ink-2);margin:14px 0 4px">分摊明细</p>
    <div class="rowlist">${rows}</div>
    <div class="divide"></div>
    <p class="sub">我的份额：<strong>${fmt(mine)}</strong>${me === b.payerId ? '（你是垫付人，应收 ' + fmt(b.amount - mine) + '）' : ''}</p>
    ${actions}
    <div class="btnrow"><button class="btn ghost" data-act="close" type="button">关闭</button></div>
  `, 'bills');
}

/* ---------- 打卡 ---------- */
function sheetCheckin(id) {
  const t = S.tasks.find(x => x.id === id);
  if (!t) return;
  const list = t.checklist.map((c, i) =>
    `<label class="chk"><input type="checkbox" data-chk="${i}" checked><span>${esc(c.t)}</span></label>`).join('');
  openSheet(`
    <h3>打卡 · ${esc(t.area)}</h3>
    <p class="sh-sub">${esc(dcn(t.date))} · ${esc(mName(t.assigneeId))} · 完成后计入贡献分 +10</p>
    <p class="sub" style="font-weight:800;color:var(--ink-2)">检查清单</p>
    ${list}
    <div class="field" style="margin-top:14px">
      <label>打卡照片</label>
      <div class="card" style="margin:0;text-align:center;color:var(--ink-3);font-size:13px;padding:18px">
        📷 点击模拟拍照上传（Demo 中以时间戳记录）
      </div>
    </div>
    <div class="btnrow">
      <button class="btn ghost" data-act="close" type="button">取消</button>
      <button class="btn" data-act="doCheckin" data-id="${t.id}" type="button">提交打卡</button>
    </div>
  `, 'shift');
}

/* ---------- 换班 ---------- */
function sheetSwap(id) {
  const t = S.tasks.find(x => x.id === id);
  if (!t) return;
  const opts = S.members.filter(m => m.id !== S.me).map(m => `<option value="${m.id}">${esc(m.name)} · ${esc(m.room)}</option>`).join('');
  openSheet(`
    <h3>申请换班</h3>
    <p class="sh-sub">${esc(dcn(t.date))} · ${esc(t.area)} · 需对方同意后生效，系统会留下变更记录</p>
    <div class="field"><label for="swTo">换给谁</label><select id="swTo">${opts}</select></div>
    <div class="field"><label for="swReason">原因（会显示给对方）</label><input id="swReason" value="当天出差，无法完成" maxlength="40"></div>
    <div class="btnrow">
      <button class="btn ghost" data-act="close" type="button">取消</button>
      <button class="btn" data-act="doSwap" data-id="${t.id}" type="button">发送换班申请</button>
    </div>
  `, 'shift');
}

/* ---------- 采购 ---------- */
function sheetBuy(id) {
  const i = S.items.find(x => x.id === id);
  if (!i) return;
  openSheet(`
    <h3>认领采购 · ${esc(i.name)}</h3>
    <p class="sh-sub">买回后填入金额，系统会自动生成一张按人头分摊的账单</p>
    <div class="field"><label for="buyAmt">实际花费（元）</label><input id="buyAmt" type="number" step="0.01" min="0" value="29.90"></div>
    <div class="preview">
      <div class="ph">提交后会发生</div>
      <div class="rowitem"><span class="nm">生成一次性账单并自动分摊给 ${S.members.length} 人</span><span class="v">${fmt(29.90 / S.members.length)}/人</span></div>
      <div class="rowitem"><span class="nm">${esc(i.name)} 库存回补</span><span class="v">${i.safety * 3} ${esc(i.unit)}</span></div>
    </div>
    <div class="btnrow">
      <button class="btn ghost" data-act="close" type="button">取消</button>
      <button class="btn" data-act="doBuy" data-id="${i.id}" type="button">确认已购买</button>
    </div>
  `, 'items');
}

/* ============================================================
   动作
   ============================================================ */
const ACT = {
  tab(el, id) { TAB = id; if (id === 'bills') BILLTAB = 'list'; render(); window.scrollTo(0, 0); },
  bills() { BILLTAB = 'list'; render(); },
  settle() { TAB = 'bills'; BILLTAB = 'settle'; closeSheet(); render(); window.scrollTo(0, 0); },
  close() { closeSheet(); },

  newbill() { sheetNewBill(); },
  bill(el, id) { sheetBill(id); },

  createBill() {
    const title = ($('#nbTitle').value || '').trim() || '未命名账单';
    const amt = Number($('#nbAmt').value) || 0;
    if (amt <= 0) { toast('金额需要大于 0'); return; }
    const payer = $('#nbPayer').value;
    const rule = $('#nbRule').value;
    const shares = computeShares(amt, rule, payer);
    const confirm = {}; S.members.forEach(m => confirm[m.id] = m.id === S.me ? 'ok' : 'pending');
    S.bills.unshift({
      id: uid('b'), title, category: $('#nbCat').value, amount: Math.round(amt * 100) / 100,
      payerId: payer, rule, shares, confirm, status: 'confirming',
      date: ymd(new Date()), version: 1, note: ($('#nbNote').value || '').trim()
    });
    save(); closeSheet(); toast('已创建，等待其他室友确认');
    TAB = 'bills'; BILLTAB = 'list'; render();
  },

  ok(el, id) {
    const b = S.bills.find(x => x.id === id); if (!b) return;
    b.confirm[S.me] = 'ok';
    b.status = billStatusOf(b.confirm);
    save(); closeSheet();
    toast(b.status === 'unpaid' ? '全员已确认，该笔进入待支付' : '已确认');
    render();
  },

  dispute(el, id) {
    const b = S.bills.find(x => x.id === id); if (!b) return;
    b.confirm[S.me] = 'dispute';
    b.status = 'disputed';
    save(); closeSheet(); toast('已提交异议，账单进入协商'); render();
  },

  revise(el, id) {
    const b = S.bills.find(x => x.id === id); if (!b) return;
    b.version += 1;
    b.shares = computeShares(b.amount, b.rule, b.payerId);
    b.confirm = {}; S.members.forEach(m => b.confirm[m.id] = 'pending');
    b.status = 'confirming';
    save(); closeSheet(); toast('已生成 v' + b.version + '，重新推送全员确认'); render();
  },

  paid(el) {
    const from = el.dataset.from, to = el.dataset.to, amount = Number(el.dataset.amt);
    S.transfers.push({ id: uid('tr'), from, to, amount, paidAt: nowHM(), receivedAt: null });
    reconcile(); save(); toast('已标记转账，等待对方确认收款'); render();
  },

  fakePaid(el) {
    const from = el.dataset.from, to = el.dataset.to, amount = Number(el.dataset.amt);
    S.transfers.push({ id: uid('tr'), from, to, amount, paidAt: nowHM(), receivedAt: null });
    reconcile(); save();
    toast('模拟：' + mName(from) + ' 已标记转账');
    render();
  },

  recv(el, id) {
    const t = S.transfers.find(x => x.id === id); if (!t) return;
    t.receivedAt = nowHM();
    reconcile(); save(); toast('已确认收款，该笔债务关闭'); render();
  },

  checkin(el, id) { sheetCheckin(id); },
  swap(el, id) { sheetSwap(id); },

  doCheckin(el, id) {
    const t = S.tasks.find(x => x.id === id); if (!t) return;
    const boxes = document.querySelectorAll('[data-chk]');
    boxes.forEach((b, i) => { if (t.checklist[i]) t.checklist[i].done = b.checked; });
    t.status = 'done'; t.proofAt = nowHM();
    save(); closeSheet(); toast('打卡成功，贡献分 +10'); render();
  },

  doSwap(el, id) {
    const t = S.tasks.find(x => x.id === id); if (!t) return;
    const to = $('#swTo').value, reason = ($('#swReason').value || '').trim();
    S.swaps.push({ id: uid('sw'), taskId: t.id, from: S.me, to, reason, status: 'pending' });
    save(); closeSheet();
    toast('换班申请已发送给 ' + mName(to) + '，切换身份即可响应');
    render();
  },

  swapOk(el, id) {
    const s = S.swaps.find(x => x.id === id); if (!s) return;
    const t = S.tasks.find(x => x.id === s.taskId);
    s.status = 'accepted';
    if (t) { t.assigneeId = s.to; t.swapTo = null; t.swapStatus = null; }
    save(); toast('已同意换班，排班已更新并留痕'); render();
  },

  swapNo(el, id) {
    const s = S.swaps.find(x => x.id === id); if (!s) return;
    s.status = 'rejected';
    save(); toast('已拒绝换班申请'); render();
  },

  empty(el, id) {
    const i = S.items.find(x => x.id === id); if (!i) return;
    i.stock = 0; i.days = 0;
    save(); toast('已标记「快没了」，采购负责人 ' + mName(i.purchaserId) + ' 已收到提醒'); render();
  },

  buy(el, id) { sheetBuy(id); },

  doBuy(el, id) {
    const i = S.items.find(x => x.id === id); if (!i) return;
    const amt = Number($('#buyAmt').value) || 0;
    if (amt <= 0) { toast('请填写实际花费'); return; }
    const shares = computeShares(amt, 'even', S.me);
    const confirm = {}; S.members.forEach(m => confirm[m.id] = m.id === S.me ? 'ok' : 'pending');
    S.bills.unshift({
      id: uid('b'), title: '公共采购 · ' + i.name, category: '日用品',
      amount: Math.round(amt * 100) / 100, payerId: S.me, rule: 'even', shares, confirm,
      status: 'confirming', date: ymd(new Date()), version: 1, note: '由 M3 物品模块自动生成'
    });
    i.stock = i.safety * 3; i.days = 30;
    save(); closeSheet();
    toast('已生成账单并回补库存到 ' + i.stock + ' ' + i.unit);
    TAB = 'items'; render();
  },

  vote(el, id) {
    const v = S.votes.find(x => x.id === id); if (!v) return;
    const yes = el.dataset.v === '1';
    const add = yes ? 'support' : 'against', del = yes ? 'against' : 'support';
    const at = v[add].indexOf(S.me);
    if (at >= 0) v[add].splice(at, 1);
    else { v[add].push(S.me); const d = v[del].indexOf(S.me); if (d >= 0) v[del].splice(d, 1); }
    save(); render();
  }
};

/* ============================================================
   事件绑定与启动
   ============================================================ */
document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('mask')) { closeSheet(); return; }
  const el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, el.dataset.id, e); }
});

$('#whoami').addEventListener('change', e => { S.me = e.target.value; save(); closeSheet(); render(); });

$('#btnReset').addEventListener('click', () => {
  if (!window.confirm('重置为初始演示数据？当前改动将丢失。')) return;
  localStorage.removeItem(KEY);
  S = seed(); save();
  TAB = 'home'; BILLTAB = 'list'; closeSheet(); render();
  toast('已重置演示数据');
});

load();
ensureTasks();
reconcile();
save();
render();
})();
</script>
